name: Disable official workflows (one-shot)

# 用 GitHub 内置的 GITHUB_TOKEN 把官方 workflow 全部禁用，
# 只保留我们自己建的。不需要任何外部凭据。

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - name: Disable all workflows except ours
        uses: actions/github-script@v7
        with:
          script: |
            // 保留这些（我们自己建的）
            const keep = [
              'msix-probe.yml',
              'zz-disable-official.yml',
            ];

            const list = await github.request(
              'GET /repos/{owner}/{repo}/actions/workflows?per_page=100',
              { owner: context.repo.owner, repo: context.repo.repo }
            );

            const lines = [];
            for (const wf of list.data.workflows) {
              const file = wf.path.split('/').pop();
              if (keep.includes(file)) {
                lines.push(`KEEP     ${wf.name}  (${file})`);
                continue;
              }
              try {
                await github.request(
                  'PUT /repos/{owner}/{repo}/actions/workflows/{workflow_id}/disable',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: wf.id,
                  }
                );
                lines.push(`DISABLED ${wf.name}  (${file})`);
              } catch (e) {
                lines.push(`FAILED   ${wf.name}  (${file})  -> ${e.message}`);
              }
            }

            const report = lines.join('\n');
            core.info(report);
            core.setOutput('report', report);

      - name: Write report to log branch
        shell: bash
        run: |
          echo "${{ steps.disable.outputs.report }}" > disable-report.txt || true
          echo "REPORT_LENGTH=$(wc -l < disable-report.txt 2>/dev/null || echo 0)"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: disable-report
          path: disable-report.txt
          if-no-files-found: warn
          retention-days: 14
