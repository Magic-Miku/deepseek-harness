name: DSH MSIX Probe

# 阶段 1：探测官方构建脚本在 CI 上的实际表现。
# 目的不是成功，而是暴露所有障碍（必填配置、工具链、依赖）。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ★ 关键修复：DSH 用 pnpm workspace，必须装 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - name: Verify pnpm
        shell: pwsh
        run: |
          Write-Host "node: $(node --version)"
          Write-Host "pnpm: $(pnpm --version)"

      - name: Probe structure
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "probe-1-structure.log"
          "=== 根目录 ===" | Out-File $log
          (Get-ChildItem -Name) | Out-File $log -Append
          "" | Out-File $log -Append
          "=== version ===" | Out-File $log -Append
          ((Get-Content "package.json" -Raw | ConvertFrom-Json).version) | Out-File $log -Append
          "" | Out-File $log -Append
          "=== apps/desktop/scripts 关键脚本 ===" | Out-File $log -Append
          (Get-ChildItem "apps/desktop/scripts" -Name -ErrorAction SilentlyContinue |
            Where-Object { $_ -match "package-target|env|toolchain" }) | Out-File $log -Append

      - name: Probe toolchain
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "probe-2-toolchain.log"
          "=== node / pnpm ===" | Out-File $log
          "node : $(node --version)" | Out-File $log -Append
          "pnpm : $(pnpm --version)" | Out-File $log -Append
          "" | Out-File $log -Append
          "=== tar（构建脚本必需，用 probeTar 的方式测）===" | Out-File $log -Append
          $tmp = Join-Path $env:RUNNER_TEMP "tarprobe"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Set-Content -Path (Join-Path $tmp "probe.txt") -Value "probe"
          Push-Location $tmp
          "tar -czf 结果:" | Out-File $log -Append
          (tar -czf probe.tar.gz probe.txt 2>&1) | Out-File $log -Append
          "exit=$LASTEXITCODE" | Out-File $log -Append
          "tar -tzf 结果:" | Out-File $log -Append
          (tar -tzf probe.tar.gz 2>&1) | Out-File $log -Append
          "exit=$LASTEXITCODE" | Out-File $log -Append
          Pop-Location
          "" | Out-File $log -Append
          "=== MSVC / vswhere（构建脚本必需）===" | Out-File $log -Append
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          "vswhere exists : $(Test-Path $vswhere)" | Out-File $log -Append
          if (Test-Path $vswhere) {
            $p = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            "VC tools path  : $p" | Out-File $log -Append
            "VC tools found : $($p -ne '')" | Out-File $log -Append
          }
          "" | Out-File $log -Append
          "=== 磁盘空间 ===" | Out-File $log -Append
          (Get-PSDrive C | ForEach-Object { "Free: {0:N1} GB" -f ($_.Free/1GB) }) | Out-File $log -Append

      - name: Install dependencies
        id: install
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "probe-3-install.log"
          pnpm install --frozen-lockfile *>&1 | Tee-Object -FilePath $log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath $log

      - name: Probe package check mode
        id: check
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "probe-4-check.log"
          "=== 尝试官方 check:package ===" | Out-File $log
          pnpm --filter @deepseek-ai/dsh-desktop run check:package *>&1 | Tee-Object -Append -FilePath $log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath $log

      - name: Commit logs
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-logs 2>/dev/null || git checkout probe-logs
          git add -f probe-*.log
          git commit -m "probe run ${{ github.run_id }} install=${{ steps.install.outcome }} check=${{ steps.check.outcome }}" || echo "nothing"
          git push -f origin probe-logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-logs
          path: probe-*.log
          if-no-files-found: warn
          retention-days: 14
