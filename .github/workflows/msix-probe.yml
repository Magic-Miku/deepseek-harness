name: DSH MSIX Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      # ★ 关键：现场生成 .env.windows（不依赖仓库里的文件）
      - name: Create .env.windows
        shell: pwsh
        run: |
          $content = @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://example.invalid/dsh-downloads
          DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.invalid/dsh-update-test
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://example.invalid/dsh-update-prod
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://example.invalid"]}
          DSH_DESKTOP_WINDOWS_CER_FILE=
          DSH_DESKTOP_WINDOWS_SIGNTOOL=
          DSH_DESKTOP_WINDOWS_KEY_CONTAINER=
          DSH_DESKTOP_WINDOWS_TOKEN_PIN=
          DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4
          '@
          # 去掉每行前导空格
          $lines = $content -split "`n" | ForEach-Object { $_.TrimStart() }
          $lines -join "`n" | Out-File "apps/desktop/.env.windows" -Encoding utf8 -NoNewline
          Write-Host "=== 已生成 .env.windows ==="
          Get-Content "apps/desktop/.env.windows"

      - name: Verify pnpm
        shell: pwsh
        run: |
          Write-Host "node: $(node --version)"
          Write-Host "pnpm: $(pnpm --version)"

      - name: Probe toolchain
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "probe-2-toolchain.log"
          "node : $(node --version)" | Out-File $log
          "pnpm : $(pnpm --version)" | Out-File $log -Append
          "" | Out-File $log -Append
          "=== tar ===" | Out-File $log -Append
          $tmp = Join-Path $env:RUNNER_TEMP "tarprobe"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Set-Content -Path (Join-Path $tmp "probe.txt") -Value "probe"
          Push-Location $tmp
          (tar -czf probe.tar.gz probe.txt 2>&1) | Out-File $log -Append
          (tar -tzf probe.tar.gz 2>&1) | Out-File $log -Append
          Pop-Location
          "" | Out-File $log -Append
          "=== MSVC ===" | Out-File $log -Append
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $p = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "VC tools : $p" | Out-File $log -Append

      - name: Install dependencies
        id: install
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "probe-3-install.log"
          pnpm install --frozen-lockfile *>&1 | Tee-Object -FilePath $log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath $log

      - name: Probe check mode
        id: check
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "probe-4-check.log"
          pnpm --filter @deepseek-ai/dsh-desktop run check:package *>&1 | Tee-Object -FilePath $log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath $log

      - name: Commit logs
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-logs 2>/dev/null || git checkout probe-logs
          git add -f probe-*.log
          git commit -m "probe run ${{ github.run_id }} install=${{ steps.install.outcome }} check=${{ steps.check.outcome }}" || echo "nothing"
          git push -f origin probe-logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-logs
          path: probe-*.log
          if-no-files-found: warn
          retention-days: 14
