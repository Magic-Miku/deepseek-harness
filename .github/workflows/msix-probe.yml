name: DSH MSIX Probe

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/msix-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - name: Create .env.windows
        shell: pwsh
        run: |
          $c = @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://example.invalid
          DOWNLOAD_TEST_RELEASE_ID=00000000000000000000000000000000
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://example.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://example.invalid"]}
          DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4
          '@
          ($c -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n" |
            Out-File "apps/desktop/.env.windows" -Encoding utf8 -NoNewline
          Get-Content "apps/desktop/.env.windows"

      - name: Install dependencies
        id: install
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "probe-1-install.log"
          pnpm install --frozen-lockfile *>&1 | Tee-Object -FilePath $log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath $log

      # 关键：用 --unsigned --check，走跳过签名的校验路径
      - name: Check (unsigned, skip signing)
        id: check_unsigned
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "probe-2-check-unsigned.log"
          Push-Location apps/desktop
          pnpm exec tsx scripts/package-target.ts win-x64 --unsigned --check *>&1 |
            Tee-Object -FilePath "..\..\$log"
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath "..\..\$log"
          Pop-Location

      # 对照：普通 check（预期因缺证书失败，用于确认差异）
      - name: Check (signed, for comparison)
        id: check_signed
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "probe-3-check-signed.log"
          pnpm --filter @deepseek-ai/dsh-desktop run check:package *>&1 |
            Tee-Object -FilePath $log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath $log

      - name: Commit logs
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-logs 2>/dev/null || git checkout probe-logs
          git add -f probe-*.log
          git commit -m "probe run ${{ github.run_id }} unsigned=${{ steps.check_unsigned.outcome }} signed=${{ steps.check_signed.outcome }}" || echo "nothing"
          git push -f origin probe-logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-logs
          path: probe-*.log
          if-no-files-found: warn
          retention-days: 14
