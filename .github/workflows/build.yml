name: MSIX Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Make fake app
        shell: pwsh
        run: |
          $root = "$PWD\fakeapp"
          New-Item -ItemType Directory -Force -Path "$root\Assets" | Out-Null
          [System.IO.File]::WriteAllBytes("$root\MyApp.exe", (New-Object byte[] 1024))
          Add-Type -AssemblyName System.Drawing
          function New-Icon($w,$h,$out) {
            $b = New-Object System.Drawing.Bitmap $w,$h
            $g = [System.Drawing.Graphics]::FromImage($b)
            $g.Clear([System.Drawing.Color]::FromArgb(58,95,170))
            $b.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $b.Dispose()
          }
          New-Icon 50 50 "$root\Assets\StoreLogo.png"
          New-Icon 44 44 "$root\Assets\Square44x44Logo.png"
          New-Icon 150 150 "$root\Assets\Square150x150Logo.png"
          New-Icon 310 150 "$root\Assets\Wide310x150Logo.png"
          Write-Host "fake app ready"
