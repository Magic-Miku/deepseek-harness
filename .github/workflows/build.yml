name: Package MSIX

on:
  workflow_dispatch:
    inputs:
      appx_version:
        description: 'MSIX version (auto = 1.0.run.0)'
        type: string
        default: 'auto'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - name: Remove stale .env.windows
        continue-on-error: true
        run: |
          if (Test-Path "apps/desktop/.env.windows") {
            Remove-Item "apps/desktop/.env.windows" -Force
          }

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile *>&1 | Tee-Object -FilePath b1-install.log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath b1-install.log
          exit $LASTEXITCODE

      - name: Prepare package settings
        id: settings
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PACKAGE_BUILD_VERSION: auto
          PACKAGE_DEPLOYMENT: test
          PACKAGE_POLICY_ORIGIN: https://example.invalid
          PACKAGE_LOGIN_ORIGINS: https://example.invalid
        run: |
          pnpm exec tsx apps/desktop/scripts/prepare-windows-ci.mjs *>&1 | Tee-Object -FilePath b0-prepare.log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath b0-prepare.log

      - name: Package dir (official script, unsigned)
        id: dir
        if: steps.settings.outcome == 'success'
        continue-on-error: true
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          Push-Location apps/desktop
          pnpm exec tsx scripts/package-target.ts win-x64 --unsigned --dir --build-version "$env:PACKAGE_VERSION" *>&1 |
            Tee-Object -FilePath "..\..\b2-dir.log"
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath "..\..\b2-dir.log"
          Pop-Location

      - name: Locate packaged dir
        id: locate
        if: steps.dir.outcome == 'success'
        shell: pwsh
        run: |
          $root = "apps/desktop/.desktop-build"
          $cands = Get-ChildItem -Path $root -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "DeepSeek Harness.exe") }
          $dir = $cands | Select-Object -First 1
          if (-not $dir) { throw "app dir not found" }
          "apdir=$($dir.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "APP DIR = $($dir.FullName)"

      - name: Generate Assets icons
        if: steps.locate.outcome == 'success'
        shell: pwsh
        run: |
          $dir = "${{ steps.locate.outputs.apdir }}"
          $assets = Join-Path $dir "Assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Add-Type -AssemblyName System.Drawing
          function New-Icon($w, $h, $out) {
            $b = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($b)
            $g.Clear([System.Drawing.Color]::FromArgb(58, 95, 170))
            $b.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $b.Dispose()
          }
          New-Icon 50 50 (Join-Path $assets "StoreLogo.png")
          New-Icon 44 44 (Join-Path $assets "Square44x44Logo.png")
          New-Icon 150 150 (Join-Path $assets "Square150x150Logo.png")
          New-Icon 310 150 (Join-Path $assets "Wide310x150Logo.png")

      - name: Write our appx config
        if: steps.locate.outcome == 'success'
        shell: pwsh
        run: |
          $L = @(
          'appId: com.deepseek.harness'
          'productName: DeepSeek Harness'
          'directories:'
          '  output: dist-msix'
          'win:'
          '  target: appx'
          'appx:'
          '  identityName: 14714BE0.320850A8A419A'
          '  publisher: CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD'
          '  publisherDisplayName: Miku'
          '  displayName: BlueFish'
          '  applicationId: App'
          '  capabilities:'
          '    - runFullTrust'
          '    - internetClient'
          '  languages:'
          '    - zh-CN'
          '    - en-US'
          )
          [System.IO.File]::WriteAllText("electron-builder-appx.yml", ($L -join "`r`n"), (New-Object System.Text.UTF8Encoding $false))
          Get-Content "electron-builder-appx.yml"

      - name: Resolve appx version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.appx_version }}"
          if ($v -eq 'auto' -or $v -eq '') { $v = "1.0.$env:GITHUB_RUN_NUMBER.0" }
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "APPX VERSION = $v"

      # ★ 改用 electron-builder 的 appx 打包器（成熟方案，Comfy 同款）
      - name: Build appx (electron-builder prepackaged)
        id: appx
        if: steps.locate.outcome == 'success'
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          EP_DRAFT: 'false'
        run: |
          $dir = "${{ steps.locate.outputs.apdir }}"
          $ver = "${{ steps.ver.outputs.version }}"
          # 在 apps/desktop 上下文里跑（electron-builder 和其依赖都在那里）
          Push-Location apps/desktop
          pnpm exec electron-builder --win appx `
            --prepackaged "$dir" `
            -c.extraMetadata.version="$ver" `
            --config electron-builder-appx.yml `
            --publish never *>&1 | Tee-Object -FilePath "..\..\b4-appx.log"
          $code = $LASTEXITCODE
          "EXIT=$code" | Tee-Object -Append -FilePath "..\..\b4-appx.log"
          Pop-Location
          if ($code -ne 0) { Write-Host "APPX BUILD FAILED (exit $code)" }

      - name: Report artifacts
        if: always()
        shell: pwsh
        run: |
          $log = "b5-artifacts.log"
          "=== dist-msix ===" | Out-File $log
          if (Test-Path "dist-msix") {
            (Get-ChildItem "dist-msix" -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} |
              Format-Table -AutoSize | Out-String) | Out-File $log -Append
          }
          Get-Content $log

      - name: Upload appx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: |
            dist-msix/*.appx
            dist-msix/*.msix
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-build-logs
          path: b*.log
          if-no-files-found: warn
          retention-days: 14
