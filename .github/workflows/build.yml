name: Package MSIX

on:
  workflow_dispatch:
    inputs:
      appx_version:
        description: 'MSIX version (auto = 1.0.run.0)'
        type: string
        default: 'auto'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - name: Remove stale .env.windows
        continue-on-error: true
        run: |
          if (Test-Path "apps/desktop/.env.windows") {
            Remove-Item "apps/desktop/.env.windows" -Force
          }

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile *>&1 | Tee-Object -FilePath b1-install.log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath b1-install.log
          exit $LASTEXITCODE

      - name: Prepare package settings
        id: settings
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PACKAGE_BUILD_VERSION: auto
          PACKAGE_DEPLOYMENT: test
          PACKAGE_POLICY_ORIGIN: https://example.invalid
          PACKAGE_LOGIN_ORIGINS: https://example.invalid
        run: |
          pnpm exec tsx apps/desktop/scripts/prepare-windows-ci.mjs *>&1 | Tee-Object -FilePath b0-prepare.log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath b0-prepare.log

      - name: Package dir (official script, unsigned)
        id: dir
        if: steps.settings.outcome == 'success'
        continue-on-error: true
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          Push-Location apps/desktop
          pnpm exec tsx scripts/package-target.ts win-x64 --unsigned --dir --build-version "$env:PACKAGE_VERSION" *>&1 |
            Tee-Object -FilePath "..\..\b2-dir.log"
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath "..\..\b2-dir.log"
          Pop-Location

      - name: Locate packaged dir
        id: locate
        if: steps.dir.outcome == 'success'
        shell: pwsh
        run: |
          $root = "apps/desktop/.desktop-build"
          $cands = Get-ChildItem -Path $root -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "DeepSeek Harness.exe") }
          $dir = $cands | Select-Object -First 1
          if (-not $dir) { throw "app dir not found" }
          "apdir=$($dir.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "APP DIR = $($dir.FullName)"

      - name: Generate Assets icons
        if: steps.locate.outcome == 'success'
        shell: pwsh
        run: |
          $dir = "${{ steps.locate.outputs.apdir }}"
          $assets = Join-Path $dir "Assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Add-Type -AssemblyName System.Drawing
          function New-Icon($w, $h, $out) {
            $b = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($b)
            $g.Clear([System.Drawing.Color]::FromArgb(58, 95, 170))
            $b.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $b.Dispose()
          }
          New-Icon 50 50 (Join-Path $assets "StoreLogo.png")
          New-Icon 44 44 (Join-Path $assets "Square44x44Logo.png")
          New-Icon 150 150 (Join-Path $assets "Square150x150Logo.png")
          New-Icon 310 150 (Join-Path $assets "Wide310x150Logo.png")

      - name: Sanitize package dir for MSIX
        if: steps.locate.outcome == 'success'
        shell: pwsh
        run: |
          $dir = "${{ steps.locate.outputs.apdir }}"
          $log = "b3-sanitize.log"
          $bins = Get-ChildItem -Path $dir -Directory -Recurse -Force -Filter ".bin" -ErrorAction SilentlyContinue
          "bin dirs: $($bins.Count)" | Out-File $log
          $bins | ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          $links = Get-ChildItem -Path $dir -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 }
          "reparse: $($links.Count)" | Out-File $log -Append
          $links | ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          Get-Content $log

      - name: Resolve appx version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.appx_version }}"
          if ($v -eq 'auto' -or $v -eq '') { $v = "1.0.$env:GITHUB_RUN_NUMBER.0" }
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "APPX VERSION = $v"

      - name: Write AppxManifest.xml
        if: steps.locate.outcome == 'success'
        shell: pwsh
        run: |
          $dir = "${{ steps.locate.outputs.apdir }}"
          $ver = "${{ steps.ver.outputs.version }}"
          $L = @(
          '<?xml version="1.0" encoding="utf-8"?>'
          '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap">'
          ('  <Identity Name="14714BE0.320850A8A419A" Publisher="CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD" Version="' + $ver + '" />')
          '  <Properties>'
          '    <DisplayName>BlueFish</DisplayName>'
          '    <PublisherDisplayName>Miku</PublisherDisplayName>'
          '    <Logo>Assets\StoreLogo.png</Logo>'
          '  </Properties>'
          '  <Dependencies>'
          '    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />'
          '  </Dependencies>'
          '  <Resources>'
          '    <Resource Language="zh-cn" />'
          '    <Resource Language="en-us" />'
          '  </Resources>'
          '  <Applications>'
          '    <Application Id="App" Executable="DeepSeek Harness.exe" EntryPoint="Windows.FullTrustApplication">'
          '      <uap:VisualElements DisplayName="BlueFish" Description="BlueFish" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">'
          '        <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" />'
          '      </uap:VisualElements>'
          '    </Application>'
          '  </Applications>'
          '  <Capabilities>'
          '    <rescap:Capability Name="runFullTrust" />'
          '    <Capability Name="internetClient" />'
          '  </Capabilities>'
          '</Package>'
          )
          $xml = $L -join "`r`n"
          [System.IO.File]::WriteAllText((Join-Path $dir "AppxManifest.xml"), $xml, (New-Object System.Text.UTF8Encoding $false))
          Get-Content (Join-Path $dir "AppxManifest.xml") | Select-Object -First 5

      # ★ 修正：用相对路径打包，避免 \\?\ 长前缀问题
      - name: Pack appx with makeappx
        id: pack
        if: steps.locate.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = "${{ steps.locate.outputs.apdir }}"
          $kits = "C:\Program Files (x86)\Windows Kits\10\bin"
          $mk = Get-ChildItem -Path $kits -Filter "makeappx.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mk) { throw "makeappx not found" }

          $parent = Split-Path $dir -Parent
          $leaf   = Split-Path $dir -Leaf
          Write-Host "parent=$parent  leaf=$leaf"

          # 切到父目录，用相对路径打包（makeappx 就不会拼 \\?\ 前缀）
          Push-Location $parent
          & $mk.FullName pack /d $leaf /p "blue-fish.appx" /o *>&1 | Tee-Object -FilePath b4-makeappx.log
          $code = $LASTEXITCODE
          "EXIT=$code" | Tee-Object -Append -FilePath b4-makeappx.log
          Pop-Location

          # 复制到 dist-msix 供上传
          New-Item -ItemType Directory -Force -Path "dist-msix" | Out-Null
          $src = Join-Path $parent "blue-fish.appx"
          if (Test-Path $src) {
            Copy-Item $src "dist-msix\blue-fish.appx" -Force
            $sz = [math]::Round((Get-Item $src).Length/1MB,2)
            Write-Host "APPX OK ($sz MB)"
          } else {
            Write-Host "APPX MISSING"
          }

      - name: Report artifacts
        if: always()
        shell: pwsh
        run: |
          $log = "b5-artifacts.log"
          "=== dist-msix ===" | Out-File $log
          if (Test-Path "dist-msix") {
            (Get-ChildItem "dist-msix" -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} |
              Format-Table -AutoSize | Out-String) | Out-File $log -Append
          }
          Get-Content $log

      - name: Upload appx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist-msix/*.appx
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-build-logs
          path: b*.log
          if-no-files-found: warn
          retention-days: 14
