name: Package MSIX
on:
  workflow_dispatch:
    inputs:
      appx_version:
        type: string
        default: 'auto'
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - name: Clean env
        continue-on-error: true
        run: |
          if (Test-Path "apps/desktop/.env.windows") { Remove-Item "apps/desktop/.env.windows" -Force }
      - name: Install
        id: install
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile *>&1 | Tee-Object b1.log
          exit $LASTEXITCODE
      - name: Prepare
        id: prep
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PACKAGE_BUILD_VERSION: auto
          PACKAGE_DEPLOYMENT: test
          PACKAGE_POLICY_ORIGIN: https://example.invalid
          PACKAGE_LOGIN_ORIGINS: https://example.invalid
        run: |
          pnpm exec tsx apps/desktop/scripts/prepare-windows-ci.mjs *>&1 | Tee-Object b2.log
      - name: Build dir
        id: dir
        if: steps.prep.outcome == 'success'
        continue-on-error: true
        env:
          PACKAGE_VERSION: ${{ steps.prep.outputs.version }}
        run: |
          Push-Location apps/desktop
          pnpm exec tsx scripts/package-target.ts win-x64 --unsigned --dir --build-version "$env:PACKAGE_VERSION" *>&1 | Tee-Object ..\..\b3.log
          Pop-Location
      - name: Move to SHORT path
        id: mv
        if: steps.dir.outcome == 'success'
        run: |
          $root = "apps/desktop/.desktop-build"
          $c = Get-ChildItem $root -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "DeepSeek Harness.exe") } | Select-Object -First 1
          if (-not $c) { throw "app dir not found" }
          Write-Host "source = $($c.FullName)"
          $short = "D:\p"
          if (Test-Path $short) { Remove-Item $short -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $short | Out-Null
          Write-Host "copying to $short ..."
          Copy-Item -Path (Join-Path $c.FullName "*") -Destination $short -Recurse -Force
          $n = (Get-ChildItem $short -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "copied files: $n"
          "short=$short" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Icons
        if: steps.mv.outcome == 'success'
        run: |
          $s = "${{ steps.mv.outputs.short }}"
          New-Item -ItemType Directory -Force -Path "$s\Assets" | Out-Null
          Add-Type -AssemblyName System.Drawing
          function I($w,$h,$o) {
            $b = New-Object System.Drawing.Bitmap $w,$h
            $g = [System.Drawing.Graphics]::FromImage($b)
            $g.Clear([System.Drawing.Color]::FromArgb(58,95,170))
            $b.Save($o, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $b.Dispose()
          }
          I 50 50 "$s\Assets\StoreLogo.png"
          I 44 44 "$s\Assets\Square44x44Logo.png"
          I 150 150 "$s\Assets\Square150x150Logo.png"
          I 310 150 "$s\Assets\Wide310x150Logo.png"
          Get-ChildItem "$s\Assets" | Select-Object Name, Length | Format-Table -AutoSize
      - name: Version
        id: ver
        run: |
          $v = "${{ inputs.appx_version }}"
          if ($v -eq 'auto') { $v = "1.0.$env:GITHUB_RUN_NUMBER.0" }
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "version = $v"
      - name: Manifest
        if: steps.mv.outcome == 'success'
        run: |
          $s = "${{ steps.mv.outputs.short }}"
          $v = "${{ steps.ver.outputs.version }}"
          $x = @(
          '<?xml version="1.0" encoding="utf-8"?>'
          '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap">'
          ('  <Identity Name="14714BE0.320850A8A419A" Version="' + $v + '" Publisher="CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD" ProcessorArchitecture="x64" />')
          '  <Properties><DisplayName>BlueFish</DisplayName><PublisherDisplayName>Miku</PublisherDisplayName><Logo>Assets\StoreLogo.png</Logo></Properties>'
          '  <Resources><Resource Language="en-us" /></Resources>'
          '  <Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" /></Dependencies>'
          '  <Capabilities><rescap:Capability Name="runFullTrust" /><Capability Name="internetClient" /></Capabilities>'
          '  <Applications><Application Id="App" Executable="DeepSeek Harness.exe" EntryPoint="Windows.FullTrustApplication">'
          '    <uap:VisualElements DisplayName="BlueFish" Description="BlueFish" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" BackgroundColor="transparent" />'
          '  </Application></Applications>'
          '</Package>'
          )
          [System.IO.File]::WriteAllText("$s\AppxManifest.xml", ($x -join "`r`n"), (New-Object System.Text.UTF8Encoding $false))
          Write-Host "manifest written"
      - name: PACK
        id: pack
        if: steps.mv.outcome == 'success'
        continue-on-error: true
        run: |
          $s = "${{ steps.mv.outputs.short }}"
          $mk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe"
          New-Item -ItemType Directory -Force -Path "D:\o" | Out-Null
          Push-Location "D:\"
          & $mk pack /d "p" /p "o\bf.appx" /o /nc *>&1 | Tee-Object ..\b4.log
          $code = $LASTEXITCODE
          "EXIT=$code" | Tee-Object -Append ..\b4.log
          Pop-Location
          if (Test-Path "D:\o\bf.appx") {
            $sz = (Get-Item "D:\o\bf.appx").Length
            Write-Host "APPX OK $sz bytes"
            New-Item -ItemType Directory -Force -Path dist-msix | Out-Null
            Copy-Item "D:\o\bf.appx" "dist-msix\bluefish.appx" -Force
          } else {
            Write-Host "APPX MISSING"
          }
      - name: Show logs
        if: always()
        run: |
          if (Test-Path b4.log) { Get-Content b4.log | Select-Object -Last 30 }
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist-msix/*.appx
          if-no-files-found: warn
          retention-days: 30
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: b*.log
          if-no-files-found: warn
          retention-days: 14
