name: Icon Lab
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build icon lab packages
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing
          $PNG = [System.Drawing.Imaging.ImageFormat]::Png

          $sdk = "C:\Program Files (x86)\Windows Kits\10\bin"
          function Find-Sdk([string]$name) {
            (Get-ChildItem $sdk -Filter $name -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\x64\\" } |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          $mk = Find-Sdk "makeappx.exe"
          $mp = Find-Sdk "makepri.exe"
          $st = Find-Sdk "signtool.exe"
          Write-Host "makeappx = $mk"
          Write-Host "makepri  = $mp"
          Write-Host "signtool = $st"
          if (-not $mk) { throw "makeappx not found" }
          if (-not $mp) { throw "makepri not found" }
          if (-not $st) { throw "signtool not found" }

          $publisher = "CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD"

          function Draw-Icon {
            param([string]$Path, [int]$W, [int]$H, $Color, [string]$Label, [bool]$Padded)
            $bmp = New-Object System.Drawing.Bitmap($W, $H)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAlias
            $m = 0; $iw = $W; $ih = $H
            if ($Padded) {
              $g.Clear([System.Drawing.Color]::Transparent)
              $m = [int][Math]::Round([Math]::Min($W, $H) * 0.14)
              $iw = $W - 2 * $m; $ih = $H - 2 * $m
              if ($iw -lt 1) { $iw = 1 }
              if ($ih -lt 1) { $ih = 1 }
              $br = New-Object System.Drawing.SolidBrush($Color)
              $g.FillEllipse($br, $m, $m, $iw, $ih)
              $br.Dispose()
            } else {
              $g.Clear($Color)
            }
            $side = [Math]::Min($iw, $ih)
            if ($side -ge 40) {
              $fs = [Math]::Max(8, [int]($side * 0.5))
              $f = New-Object System.Drawing.Font("Arial", $fs, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
              $sf = New-Object System.Drawing.StringFormat
              $sf.Alignment = [System.Drawing.StringAlignment]::Center
              $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
              $rect = New-Object System.Drawing.RectangleF($m, $m, $iw, $ih)
              $g.DrawString($Label, $f, [System.Drawing.Brushes]::White, $rect, $sf)
              $f.Dispose()
            }
            $g.Dispose()
            $bmp.Save($Path, $PNG)
            $bmp.Dispose()
          }

          $bases = @(
            @("StoreLogo",        50,  50),
            @("Square44x44Logo",  44,  44),
            @("Square71x71Logo",  71,  71),
            @("Square150x150Logo",150, 150),
            @("Square310x310Logo",310, 310),
            @("Wide310x150Logo",  310, 150),
            @("SplashScreen",     620, 300),
            @("BadgeLogo",        24,  24),
            @("AppList",          44,  44)
          )
          $tsizes = @(16,20,24,30,32,36,40,48,60,64,72,80,96,256)

          $out = "C:\lab"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $variants = @(
            [pscustomobject]@{ Id="MagicMiku.IconLabA"; Label="A"; Name="Icon Lab A"; R=225; G=45;  B=45;  Padded=$false; Full=$false; Pri=$false },
            [pscustomobject]@{ Id="MagicMiku.IconLabB"; Label="B"; Name="Icon Lab B"; R=40;  G=175; B=70;  Padded=$true;  Full=$false; Pri=$false },
            [pscustomobject]@{ Id="MagicMiku.IconLabC"; Label="C"; Name="Icon Lab C"; R=55;  G=85;  B=235; Padded=$false; Full=$true;  Pri=$true  }
          )

          foreach ($v in $variants) {
            $dir = Join-Path $out $v.Label
            $ast = Join-Path $dir "Assets"
            New-Item -ItemType Directory -Force -Path $ast | Out-Null
            $col = [System.Drawing.Color]::FromArgb([int]$v.R, [int]$v.G, [int]$v.B)

            foreach ($b in $bases) {
              Draw-Icon -Path (Join-Path $ast ($b[0] + ".png")) -W ([int]$b[1]) -H ([int]$b[2]) -Color $col -Label $v.Label -Padded ([bool]$v.Padded)
            }
            if ($v.Full) {
              foreach ($t in $tsizes) {
                foreach ($suf in @("", "_altform-unplated", "_altform-lightunplated")) {
                  Draw-Icon -Path (Join-Path $ast ("AppList.targetsize-$t$suf.png")) -W $t -H $t -Color $col -Label $v.Label -Padded $false
                }
              }
            }

            Copy-Item "C:\Windows\System32\cmd.exe" (Join-Path $dir "IconLab.exe") -Force

            $xml = @(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap">'
              ('  <Identity Name="' + $v.Id + '" Publisher="' + $publisher + '" Version="1.0.0.0" />')
              '  <Properties>'
              ('    <DisplayName>' + $v.Name + '</DisplayName>')
              '    <PublisherDisplayName>Miku Icon Lab</PublisherDisplayName>'
              ('    <Description>Icon lab variant ' + $v.Label + '</Description>')
              '    <Logo>Assets\StoreLogo.png</Logo>'
              '  </Properties>'
              '  <Dependencies>'
              '    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />'
              '  </Dependencies>'
              '  <Resources>'
              '    <Resource Language="en-us" />'
              '  </Resources>'
              '  <Applications>'
              '    <Application Id="App" Executable="IconLab.exe" EntryPoint="Windows.FullTrustApplication">'
              ('      <uap:VisualElements DisplayName="' + $v.Name + '" Description="Icon lab ' + $v.Label + '" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">')
              '        <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" Square310x310Logo="Assets\Square310x310Logo.png" Square71x71Logo="Assets\Square71x71Logo.png" />'
              '        <uap:SplashScreen Image="Assets\SplashScreen.png" />'
              '      </uap:VisualElements>'
              '    </Application>'
              '  </Applications>'
              '  <Capabilities>'
              '    <rescap:Capability Name="runFullTrust" />'
              '  </Capabilities>'
              '</Package>'
            )
            [IO.File]::WriteAllText((Join-Path $dir "AppxManifest.xml"), ($xml -join "`n"), (New-Object Text.UTF8Encoding $false))

            if ($v.Pri) {
              & $mp createconfig /cf (Join-Path $dir "priconfig.xml") /dq lang-en-US /o | Out-Null
              & $mp new /pr $dir /cf (Join-Path $dir "priconfig.xml") /mn (Join-Path $dir "AppxManifest.xml") /of (Join-Path $dir "resources.pri") /o | Out-Null
              if (-not (Test-Path (Join-Path $dir "resources.pri"))) { throw "pri failed for $($v.Label)" }
              Write-Host ("{0}: pri  = {1} B" -f $v.Label, (Get-Item (Join-Path $dir "resources.pri")).Length)
              Remove-Item (Join-Path $dir "priconfig.xml") -Force -ErrorAction SilentlyContinue
            }
            Write-Host ("{0}: files = {1}" -f $v.Label, (Get-ChildItem $dir -Recurse -File).Count)
          }

          Write-Host ""
          Write-Host "=== create self-signed code signing certificate ==="
          $pwPlain = "IconLab!" + [Guid]::NewGuid().ToString("N").Substring(0, 8)
          $sec = ConvertTo-SecureString $pwPlain -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $publisher `
            -FriendlyName "Icon Lab Test" `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5)
          Write-Host ("thumbprint = {0}" -f $cert.Thumbprint)
          Write-Host ("subject    = {0}" -f $cert.Subject)

          $cerPath = Join-Path $out "IconLab.cer"
          $pfxPath = Join-Path $out "IconLab.pfx"
          Export-Certificate -Cert $cert -FilePath $cerPath -Type CERT | Out-Null
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $sec -CryptoAlgorithmOption AES256_SHA256 | Out-Null

          Write-Host ""
          Write-Host "=== sign packages ==="
          foreach ($v in $variants) {
            $src = Join-Path $out ($v.Label + ".appx")
            & $mk pack /d (Join-Path $out $v.Label) /p $src /o | Out-Null
            if (-not (Test-Path $src)) { throw "pack failed for $($v.Label)" }
            & $st sign /fd SHA256 /f $pfxPath /p $pwPlain /tr http://timestamp.digicert.com /td SHA256 $src | Write-Host
            if ($LASTEXITCODE -ne 0) {
              Write-Host "timestamp failed, retry without timestamp"
              & $st sign /fd SHA256 /f $pfxPath /p $pwPlain $src | Write-Host
            }
            $sig = & $st verify /pa $src 2>&1 | Out-String
            Write-Host ("{0}: signed = {1}  ({2:N1} KB)" -f $v.Label, ($LASTEXITCODE -eq 0), ((Get-Item $src).Length / 1KB))
          }
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "=== loose zips (no signing needed, use -Register) ==="
          foreach ($v in $variants) {
            $zip = Join-Path $out ("Loose" + $v.Label + ".zip")
            Compress-Archive -Path (Join-Path $out $v.Label "*") -DestinationPath $zip -Force
            Write-Host ("{0}: loose = {1:N1} KB" -f $v.Label, ((Get-Item $zip).Length / 1KB))
          }

          $readme = @(
            'ICON LAB',
            '',
            'Three tiny standalone apps (different identities) so they can coexist:',
            '  A = full-bleed opaque icon, NO targetsize assets, no resources.pri',
            '  B = transparent + padded icon, NO targetsize assets, no resources.pri',
            '  C = full-bleed opaque icon + 42 targetsize assets + resources.pri',
            '',
            '========== METHOD 1: double-click (needs the certificate once) ==========',
            '  1. Double-click IconLab.cer',
            '  2. Click "Install Certificate..."',
            '  3. Store location: Local Machine   -> Next   (needs admin)',
            '  4. "Place all certificates in the following store" -> Browse',
            '  5. Choose "Trusted People"  (or "Trusted Root Certification Authorities")',
            '  6. OK -> Next -> Finish -> security warning -> Yes',
            '  7. Now double-click A.appx, B.appx, C.appx to install each.',
            '',
            '========== METHOD 2: no certificate needed ==========',
            '  Unzip LooseA.zip / LooseB.zip / LooseC.zip, then in an ADMIN PowerShell:',
            '    Add-AppxPackage -Register "<folder>\A\AppxManifest.xml"',
            '    Add-AppxPackage -Register "<folder>\B\AppxManifest.xml"',
            '    Add-AppxPackage -Register "<folder>\C\AppxManifest.xml"',
            '',
            '========== WHAT TO CHECK ==========',
            '  Pin A, B, C to the taskbar and compare:',
            '    full bleed -> colour fills the whole square, edge to edge, no plate',
            '    plated     -> small shape centred on a coloured background plate',
            '  Also check Start menu / All apps list and ALT+TAB.',
            '',
            '========== UNINSTALL ==========',
            '  Get-AppxPackage MagicMiku.IconLabA | Remove-AppxPackage',
            '  Get-AppxPackage MagicMiku.IconLabB | Remove-AppxPackage',
            '  Get-AppxPackage MagicMiku.IconLabC | Remove-AppxPackage',
            '  (the certificate can stay; it is harmless and 5 years validity)'
          )
          $readme -join "`r`n" | Out-File -FilePath (Join-Path $out "README.txt") -Encoding UTF8

          Write-Host ""
          Write-Host "=== built ==="
          Get-ChildItem $out -File | Sort-Object Name | ForEach-Object {
            Write-Host ("  {0,-18} {1,10:N1} KB" -f $_.Name, ($_.Length / 1KB))
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-lab
          path: C:\lab\*
          if-no-files-found: warn
          retention-days: 7
