name: WinApp Pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Silent install
        id: inst
        run: |
          $tmp = "$env:RUNNER_TEMP\dsh.exe"
          curl.exe -L --retry 3 --max-time 1800 -o $tmp "https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          if ((Get-Item $tmp).Length -lt 200MB) { throw "download too small" }
          $target = "C:\DSHApp"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $p = Start-Process -FilePath $tmp -ArgumentList "/S", "/D=$target" -Wait -PassThru
          Write-Host "installer exit = $($p.ExitCode)"
          Start-Sleep -Seconds 6
          $exe = Get-ChildItem $target -Recurse -Filter "DeepSeek Harness.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "app exe not found" }
          $n = (Get-ChildItem $target -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "appdir = $($exe.Directory.FullName)  files = $n"
          "appdir=$($exe.Directory.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Write manifest and icons
        run: |
          $d = "${{ steps.inst.outputs.appdir }}"
          $v = "1.0.$env:GITHUB_RUN_NUMBER.0"
          $L = @(
          '<?xml version="1.0" encoding="utf-8"?>'
          '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap">'
          ('  <Identity Name="14714BE0.320850A8A419A" Publisher="CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD" Version="' + $v + '" ProcessorArchitecture="x64" />')
          '  <Properties><DisplayName>BlueFish</DisplayName><PublisherDisplayName>Miku</PublisherDisplayName><Logo>Assets\StoreLogo.png</Logo></Properties>'
          '  <Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" /></Dependencies>'
          '  <Resources><Resource Language="en-us" /></Resources>'
          '  <Capabilities><Capability Name="internetClient" /><rescap:Capability Name="runFullTrust" /></Capabilities>'
          '  <Applications><Application Id="App" Executable="DeepSeek Harness.exe" EntryPoint="Windows.FullTrustApplication">'
          '    <uap:VisualElements DisplayName="BlueFish" Description="BlueFish" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" />'
          '  </Application></Applications>'
          '</Package>'
          )
          [System.IO.File]::WriteAllText((Join-Path $d "AppxManifest.xml"), ($L -join "`r`n"), (New-Object System.Text.UTF8Encoding $false))
          $a = Join-Path $d "Assets"
          New-Item -ItemType Directory -Force -Path $a | Out-Null
          Add-Type -AssemblyName System.Drawing
          function I($w,$h,$o) {
            $b = New-Object System.Drawing.Bitmap $w,$h
            $g = [System.Drawing.Graphics]::FromImage($b)
            $g.Clear([System.Drawing.Color]::FromArgb(58,95,170))
            $b.Save($o, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $b.Dispose()
          }
          I 50 50 (Join-Path $a "StoreLogo.png")
          I 44 44 (Join-Path $a "Square44x44Logo.png")
          I 150 150 (Join-Path $a "Square150x150Logo.png")
          I 310 150 (Join-Path $a "Wide310x150Logo.png")
          Write-Host "manifest + icons done"
      - name: Stage with aggressive exclusions
        id: stage
        run: |
          $src = "${{ steps.inst.outputs.appdir }}"
          $dst = "C:\Staged"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          # 复制时排除
          $exclDirs  = @("__pycache__", "tests", "test", "docs", "doc", "examples", "example", "demos")
          $exclExts  = @(".pyc", ".pyo", ".pyi", ".pdb", ".patch", ".diff", ".md", ".txt", ".rst", ".html")

          $total = 0; $copied = 0; $skippedDir = 0; $skippedExt = 0
          $log = "s-stage.log"
          "=== 阶段复制（磁盘文件不动，只影响打包输入）===" | Out-File $log

          function Copy-Filtered($cur, $rel) {
            foreach ($f in [System.IO.Directory]::GetFiles($cur)) {
              $script:total++
              $nm = [System.IO.Path]::GetFileName($f)
              $ext = [System.IO.Path]::GetExtension($f).ToLower()
              if ($exclExts -contains $ext) { $script:skippedExt++; continue }
              $target = Join-Path $dst (Join-Path $rel $nm)
              $td = [System.IO.Path]::GetDirectoryName($target)
              if (-not (Test-Path $td)) { New-Item -ItemType Directory -Force -Path $td | Out-Null }
              [System.IO.File]::Copy($f, $target, $true)
              $script:copied++
            }
            foreach ($sub in [System.IO.Directory]::GetDirectories($cur)) {
              $nm = [System.IO.Path]::GetFileName($sub)
              if ($exclDirs -contains $nm) { $script:skippedDir++; continue }
              Copy-Filtered $sub (Join-Path $rel $nm)
            }
          }
          Copy-Filtered $src ""

          "原始文件数      : $total" | Out-File $log -Append
          "复制的文件数    : $copied" | Out-File $log -Append
          "排除的目录数    : $skippedDir" | Out-File $log -Append
          "排除的扩展名文件: $skippedExt" | Out-File $log -Append
          Get-Content $log
          "staged=$dst" | Out-File -Append $env:GITHUB_OUTPUT
      - name: MakeAppx on staged
        continue-on-error: true
        run: |
          $st = "${{ steps.stage.outputs.staged }}"
          $mk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe"
          New-Item -ItemType Directory -Force -Path "C:\out" | Out-Null
          New-Item -ItemType Directory -Force -Path dist-msix | Out-Null
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & $mk pack /d $st /p "C:\out\staged.appx" /o 2>&1 | Tee-Object b1.log
          $code = $LASTEXITCODE
          $sw.Stop()
          Write-Host "EXIT=$code  elapsed=$([math]::Round($sw.Elapsed.TotalSeconds))s"
          $f = Get-ChildItem "C:\out" -Include *.appx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($f) {
            Write-Host ("*** SUCCESS " + $f.FullName + " {0:N1} MB ***" -f ($f.Length/1MB))
            Copy-Item $f.FullName "dist-msix\bluefish-staged.appx" -Force
          } else {
            Write-Host "*** FAILED ***"
            $n = (Get-Content b1.log -ErrorAction SilentlyContinue | Where-Object { $_ -match 'as a payload file' }).Count
            Write-Host "处理文件数 = $n"
            Get-Content b1.log -ErrorAction SilentlyContinue | Select-Object -Last 4
          }
      - name: Commit logs
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diag-logs 2>/dev/null || git checkout diag-logs
          git rm -r --cached . -q 2>/dev/null || true
          for f in s-stage.log b1.log; do [ -f "$f" ] && cp "$f" . 2>/dev/null || true; done
          git add -f *.log 2>/dev/null || true
          git commit -m "logs run ${{ github.run_id }}" || echo "nothing"
          git push -f origin dist-msix 2>/dev/null || git push -f origin diag-logs || echo "push failed"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist-msix/*
          if-no-files-found: warn
          retention-days: 30
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winapp-logs
          path: |
            *.log
          if-no-files-found: warn
          retention-days: 14
