name: WinApp Pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - name: pnpm install
        run: |
          pnpm install --frozen-lockfile *>&1 | Tee-Object i1.log
          Write-Host "EXIT=$LASTEXITCODE"
      - name: Silent install app
        id: inst
        run: |
          $tmp = "$env:RUNNER_TEMP\dsh.exe"
          curl.exe -L --retry 3 --max-time 1800 -o $tmp "https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          if ((Get-Item $tmp).Length -lt 200MB) { throw "download too small" }
          $target = "C:\DSHApp"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $p = Start-Process -FilePath $tmp -ArgumentList "/S", "/D=$target" -Wait -PassThru
          Write-Host "installer exit = $($p.ExitCode)"
          Start-Sleep -Seconds 6
          $exe = Get-ChildItem $target -Recurse -Filter "DeepSeek Harness.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "app exe not found" }
          $n = (Get-ChildItem $target -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "appdir = $($exe.Directory.FullName)   files = $n"
          "appdir=$($exe.Directory.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Check electron-builder availability
        run: |
          Write-Host "=== apps/desktop 下查找 electron-builder ==="
          $eb = "apps\desktop\node_modules\.bin\electron-builder.cmd"
          Write-Host "exists: $(Test-Path $eb)"
          if (Test-Path $eb) { & $eb --version }
          Write-Host "=== pnpm --filter 方式 ==="
          pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --version 2>&1 | Select-Object -First 5
      - name: Write config
        run: |
          $L = @(
          'appId: com.deepseek.harness'
          'productName: DeepSeek Harness'
          'directories:'
          '  output: C:\ebout'
          'win:'
          '  target: appx'
          'appx:'
          '  identityName: 14714BE0.320850A8A419A'
          '  publisher: CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD'
          '  publisherDisplayName: Miku'
          '  displayName: BlueFish'
          '  applicationId: App'
          '  capabilities:'
          '    - runFullTrust'
          '    - internetClient'
          '  languages:'
          '    - en-US'
          '    - zh-CN'
          )
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\eb-appx.yml", ($L -join "`r`n"), (New-Object System.Text.UTF8Encoding $false))
          Get-Content "$env:GITHUB_WORKSPACE\eb-appx.yml"
      - name: Pack with electron-builder
        id: pack
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $d = "${{ steps.inst.outputs.appdir }}"
          New-Item -ItemType Directory -Force -Path "C:\ebout" | Out-Null
          $eb = "apps\desktop\node_modules\.bin\electron-builder.cmd"
          if (-not (Test-Path $eb)) { throw "electron-builder not found at $eb" }
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & $eb --win appx --prepackaged $d --config "$env:GITHUB_WORKSPACE\eb-appx.yml" --publish never *>&1 | Tee-Object p1.log
          $code = $LASTEXITCODE
          $sw.Stop()
          Write-Host "EXIT=$code  elapsed=$([math]::Round($sw.Elapsed.TotalSeconds))s"
          Write-Host "=== C:\ebout ==="
          Get-ChildItem "C:\ebout" -Recurse -ErrorAction SilentlyContinue | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          $appx = Get-ChildItem "C:\ebout" -Recurse -Include *.appx,*.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($appx) {
            Write-Host ("*** SUCCESS " + $appx.FullName + " {0:N1} MB ***" -f ($appx.Length/1MB))
            New-Item -ItemType Directory -Force -Path dist-msix | Out-Null
            Copy-Item $appx.FullName "dist-msix\bluefish.appx" -Force
          } else {
            Write-Host "*** FAILED ***"
            Get-Content p1.log -ErrorAction SilentlyContinue | Select-Object -Last 30
          }
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist-msix/*
          if-no-files-found: warn
          retention-days: 30
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winapp-logs
          path: |
            i*.log
            p*.log
          if-no-files-found: warn
          retention-days: 14
