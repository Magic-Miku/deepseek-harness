name: WinApp Pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Silent install
        id: inst
        run: |
          $tmp = "$env:RUNNER_TEMP\dsh.exe"
          curl.exe -L --retry 3 --max-time 1800 -o $tmp "https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          if ((Get-Item $tmp).Length -lt 200MB) { throw "download too small" }
          $target = "C:\DSHApp"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $p = Start-Process -FilePath $tmp -ArgumentList "/S", "/D=$target" -Wait -PassThru
          Write-Host "installer exit = $($p.ExitCode)"
          Start-Sleep -Seconds 6
          $exe = Get-ChildItem $target -Recurse -Filter "DeepSeek Harness.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "app exe not found" }
          $n = (Get-ChildItem $target -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "appdir = $($exe.Directory.FullName)  files = $n"
          "appdir=$($exe.Directory.FullName)" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Inspect the suspect file
        run: |
          $d = "${{ steps.inst.outputs.appdir }}"
          $suspect = Join-Path $d "resources\runtime\primary-runtime\dependencies\python\Lib\site-packages\pandas\core\sorting.py"
          $log = "s1-suspect.log"
          "=== 1. 文件是否存在 ===" | Out-File $log
          "exists = $(Test-Path $suspect)" | Out-File $log -Append
          if (-not (Test-Path $suspect)) { Get-Content $log; exit }

          "=== 2. 文件属性 ===" | Out-File $log -Append
          $fi = Get-Item -LiteralPath $suspect
          "Name       = $($fi.Name)" | Out-File $log -Append
          "Length     = $($fi.Length)" | Out-File $log -Append
          "Attributes = $($fi.Attributes)" | Out-File $log -Append
          "CreationTimeUtc   = $($fi.CreationTimeUtc)" | Out-File $log -Append
          "LastWriteTimeUtc  = $($fi.LastWriteTimeUtc)" | Out-File $log -Append
          "LinkType   = $($fi.LinkType)" | Out-File $log -Append
          "Target     = $($fi.Target)" | Out-File $log -Append

          "=== 3. 是否重解析点/符号链接 ===" | Out-File $log -Append
          $reparse = ($fi.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0
          "ReparsePoint = $reparse" | Out-File $log -Append
          "==> fsutil 检查 ==" | Out-File $log -Append
          (fsutil reparsepoint query "$suspect" 2>&1 | Select-Object -First 10) | Out-File $log -Append

          "=== 4. 尝试独占打开 ===" | Out-File $log -Append
          try {
            $fs = [System.IO.File]::Open($suspect, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::None)
            $fs.Close()
            "独占打开: 成功（没被占用）" | Out-File $log -Append
          } catch {
            "独占打开: 失败 - $($_.Exception.Message)" | Out-File $log -Append
          }

          "=== 5. 文件前 15 行内容 ===" | Out-File $log -Append
          (Get-Content -LiteralPath $suspect -TotalCount 15 -ErrorAction SilentlyContinue) | Out-File $log -Append

          "=== 6. 十六进制头 32 字节 ===" | Out-File $log -Append
          try {
            $bytes = [System.IO.File]::ReadAllBytes($suspect)
            $head = $bytes[0..31] | ForEach-Object { $_.ToString('X2') }
            ($head -join ' ') | Out-File $log -Append
          } catch { "读取失败: $($_.Exception.Message)" | Out-File $log -Append }

          Get-Content $log

      - name: Check all files in the parent dir
        run: |
          $d = "${{ steps.inst.outputs.appdir }}"
          $dir = Join-Path $d "resources\runtime\primary-runtime\dependencies\python\Lib\site-packages\pandas\core"
          $log = "s2-dir.log"
          "=== pandas\core 目录 ===" | Out-File $log
          if (-not (Test-Path $dir)) { "目录不存在" | Out-File $log -Append; Get-Content $log; exit }
          $files = Get-ChildItem -LiteralPath $dir -File -ErrorAction SilentlyContinue | Sort-Object Name
          "文件数 = $($files.Count)" | Out-File $log -Append
          "" | Out-File $log -Append
          "--- 独占打开测试 ---" | Out-File $log -Append
          $locked = 0
          foreach ($f in $files) {
            try {
              $fs = [System.IO.File]::Open($f.FullName, 'Open', 'Read', 'None')
              $fs.Close()
            } catch {
              "LOCKED: $($f.Name) - $($_.Exception.Message)" | Out-File $log -Append
              $locked++
            }
          }
          "被占用文件数 = $locked" | Out-File $log -Append
          "" | Out-File $log -Append
          "--- 含非 ASCII 字符的文件名 ---" | Out-File $log -Append
          $files | Where-Object { $_.Name -match '[^\x20-\x7E]' } | ForEach-Object { "  $($_.Name)" } | Out-File $log -Append
          "" | Out-File $log -Append
          "--- 名字以点/空格结尾 ---" | Out-File $log -Append
          $files | Where-Object { $_.Name -ne $_.Name.TrimEnd('.',' ') } | ForEach-Object { "  [$($_.Name)]" } | Out-File $log -Append
          Get-Content $log

      - name: Full scan for problems
        run: |
          $d = "${{ steps.inst.outputs.appdir }}"
          $log = "s3-scan.log"
          "=== 全盘扫描（用 .NET 绕过 PowerShell 通配符）===" | Out-File $log
          $problems = @{
            locked = @()
            nonAscii = @()
            trailing = @()
            reparse = @()
            longpath = @()
          }
          $stack = New-Object System.Collections.Stack
          $stack.Push($d)
          $count = 0
          while ($stack.Count -gt 0) {
            $cur = $stack.Pop()
            try {
              foreach ($f in [System.IO.Directory]::GetFiles($cur)) {
                $count++
                $nm = [System.IO.Path]::GetFileName($f)
                $rel = $f.Substring($d.Length)
                if ($nm -match '[^\x20-\x7E]') { $problems.nonAscii += $rel }
                if ($nm -ne $nm.TrimEnd('.',' ')) { $problems.trailing += $rel }
                if ($rel.Length -gt 200) { $problems.longpath += "$($rel.Length) : $rel" }
                try {
                  $fs = [System.IO.File]::Open($f, 'Open', 'Read', 'None')
                  $fs.Close()
                } catch { $problems.locked += "$rel : $($_.Exception.Message)" }
              }
              foreach ($sub in [System.IO.Directory]::GetDirectories($cur)) {
                $attrs = [System.IO.File]::GetAttributes($sub)
                if (($attrs -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                  $problems.reparse += $sub.Substring($d.Length)
                } else {
                  $stack.Push($sub)
                }
              }
            } catch { "ERR: $cur - $($_.Exception.Message)" | Out-File $log -Append }
          }
          "扫描文件数 = $count" | Out-File $log -Append
          "" | Out-File $log -Append
          "被占用 = $($problems.locked.Count)" | Out-File $log -Append
          $problems.locked | Select-Object -First 20 | Out-File $log -Append
          "" | Out-File $log -Append
          "非ASCII名 = $($problems.nonAscii.Count)" | Out-File $log -Append
          $problems.nonAscii | Select-Object -First 20 | Out-File $log -Append
          "" | Out-File $log -Append
          "末尾点/空格 = $($problems.trailing.Count)" | Out-File $log -Append
          $problems.trailing | Select-Object -First 20 | Out-File $log -Append
          "" | Out-File $log -Append
          "符号链接 = $($problems.reparse.Count)" | Out-File $log -Append
          $problems.reparse | Select-Object -First 20 | Out-File $log -Append
          "" | Out-File $log -Append
          "超长路径(>200) = $($problems.longpath.Count)" | Out-File $log -Append
          $problems.longpath | Sort-Object -Descending | Select-Object -First 20 | Out-File $log -Append
          Get-Content $log | Select-Object -First 80

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winapp-logs
          path: s*.log
          if-no-files-found: warn
          retention-days: 14
