name: WinApp Pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install app
        id: inst
        run: |
          $tmp = "$env:RUNNER_TEMP\dsh.exe"
          curl.exe -L --retry 3 --max-time 1800 -o $tmp "https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          if ((Get-Item $tmp).Length -lt 200MB) { throw "download too small" }
          $t = "C:\DSHApp"
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          Start-Process -FilePath $tmp -ArgumentList "/S","/D=$t" -Wait
          Start-Sleep 6
          $exe = Get-ChildItem $t -Recurse -Filter "DeepSeek Harness.exe" | Select-Object -First 1
          if (-not $exe) { throw "no exe" }
          Write-Host "appdir = $($exe.Directory.FullName)"
          "appdir=$($exe.Directory.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Fine scan 3000-4000
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $src = "${{ steps.inst.outputs.appdir }}"
          $mk  = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe"
          $ver = "1.0.$env:GITHUB_RUN_NUMBER.0"
          $sum = "s-scan.log"
          "=== fine scan 3000-4000 ===" | Out-File $sum -Encoding UTF8
          "version = $ver" | Out-File $sum -Append -Encoding UTF8

          $full = "C:\Full"
          if (Test-Path $full) { Remove-Item $full -Recurse -Force -ErrorAction SilentlyContinue }
          robocopy $src $full /E /NFL /NDL /NP /R:1 /W:1 | Out-Null

          $all = @(Get-ChildItem $full -Recurse -File -Force -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -ne "AppxManifest.xml" } | Sort-Object FullName)
          "total = $($all.Count)" | Out-File $sum -Append -Encoding UTF8
          "" | Out-File $sum -Append -Encoding UTF8

          $mlines = @(
          '<?xml version="1.0" encoding="utf-8"?>'
          '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap">'
          ('  <Identity Name="14714BE0.320850A8A419A" Publisher="CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD" Version="' + $ver + '" ProcessorArchitecture="x64" />')
          '  <Properties><DisplayName>BlueFish</DisplayName><PublisherDisplayName>Miku</PublisherDisplayName><Logo>Assets\StoreLogo.png</Logo></Properties>'
          '  <Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" /></Dependencies>'
          '  <Resources><Resource Language="en-us" /></Resources>'
          '  <Capabilities><Capability Name="internetClient" /><rescap:Capability Name="runFullTrust" /></Capabilities>'
          '  <Applications><Application Id="App" Executable="DeepSeek Harness.exe" EntryPoint="Windows.FullTrustApplication">'
          '    <uap:VisualElements DisplayName="BlueFish" Description="BlueFish" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" />'
          '  </Application></Applications>'
          '</Package>'
          )
          $manifest = $mlines -join "`r`n"
          Add-Type -AssemblyName System.Drawing -ErrorAction SilentlyContinue

          foreach ($limit in @(3000,3100,3200,3300,3400,3500,3600,3700,3800,3900,4000)) {
            $stage = "C:\S"
            if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null

            foreach ($f in ($all | Select-Object -First $limit)) {
              try {
                $rel = $f.FullName.Substring($full.Length).TrimStart('\')
                $tgt = Join-Path $stage $rel
                $td = [System.IO.Path]::GetDirectoryName($tgt)
                if (-not (Test-Path $td)) { New-Item -ItemType Directory -Force -Path $td -ErrorAction SilentlyContinue | Out-Null }
                [System.IO.File]::Copy($f.FullName, $tgt, $true)
              } catch {}
            }
            [System.IO.File]::WriteAllText((Join-Path $stage "AppxManifest.xml"), $manifest, (New-Object System.Text.UTF8Encoding $false))
            $as = Join-Path $stage "Assets"
            New-Item -ItemType Directory -Force -Path $as | Out-Null
            foreach ($s in @(@(50,50,"StoreLogo.png"),@(44,44,"Square44x44Logo.png"),@(150,150,"Square150x150Logo.png"),@(310,150,"Wide310x150Logo.png"))) {
              try {
                $b = New-Object System.Drawing.Bitmap $s[0], $s[1]
                $g = [System.Drawing.Graphics]::FromImage($b)
                $g.Clear([System.Drawing.Color]::FromArgb(58,95,170))
                $b.Save((Join-Path $as $s[2]), [System.Drawing.Imaging.ImageFormat]::Png)
                $g.Dispose(); $b.Dispose()
              } catch {}
            }

            $out = "C:\out\l$limit.appx"
            New-Item -ItemType Directory -Force -Path "C:\out" | Out-Null
            Remove-Item $out -Force -ErrorAction SilentlyContinue
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $log = & $mk pack /d $stage /p $out /o 2>&1
            $code = $LASTEXITCODE
            $sw.Stop()
            $ok = Test-Path $out
            $boundary = $all[$limit-1].FullName.Substring($full.Length)
            $sizeTxt = if ($ok) { "{0:N1}MB" -f ((Get-Item $out).Length/1MB) } else { "-" }
            $line = "{0,5}  {1}  code={2}  {3,4}s  {4,9}  idx{0}={5}" -f $limit, $(if($ok){"OK  "}else{"FAIL"}), $code, [math]::Round($sw.Elapsed.TotalSeconds), $sizeTxt, $boundary
            Write-Host $line
            $line | Out-File $sum -Append -Encoding UTF8
            if (-not $ok) {
              ($log | Where-Object { $_ -match 'error' } | Select-Object -Last 1) | ForEach-Object { "        " + $_.Trim() } | Out-File $sum -Append -Encoding UTF8
            }
            Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $out -Force -ErrorAction SilentlyContinue
          }
          "=== end ===" | Out-File $sum -Append -Encoding UTF8
          Get-Content $sum
      - name: Commit logs
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diag-logs 2>/dev/null || git checkout diag-logs
          git rm -r --cached . -q 2>/dev/null || true
          [ -f s-scan.log ] && cp s-scan.log . || true
          git add -f *.log 2>/dev/null || true
          git commit -m "scan ${{ github.run_id }}" || echo "nothing"
          git push -f origin diag-logs || echo "push failed"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winapp-logs
          path: s-scan.log
          if-no-files-found: warn
          retention-days: 14
