name: WinApp Pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - name: pnpm install
        run: |
          pnpm install --frozen-lockfile *>&1 | Tee-Object i1.log
          Write-Host "EXIT=$LASTEXITCODE"
      - name: Silent install app
        id: inst
        run: |
          $tmp = "$env:RUNNER_TEMP\dsh.exe"
          curl.exe -L --retry 3 --max-time 1800 -o $tmp "https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          if ((Get-Item $tmp).Length -lt 200MB) { throw "download too small" }
          $target = "C:\DSHApp"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $p = Start-Process -FilePath $tmp -ArgumentList "/S", "/D=$target" -Wait -PassThru
          Write-Host "installer exit = $($p.ExitCode)"
          Start-Sleep -Seconds 6
          $exe = Get-ChildItem $target -Recurse -Filter "DeepSeek Harness.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "app exe not found" }
          $n = (Get-ChildItem $target -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "appdir = $($exe.Directory.FullName)   files = $n"
          "appdir=$($exe.Directory.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Diagnose electron module
        run: |
          Write-Host "=== apps/desktop/node_modules/electron ==="
          Test-Path "apps\desktop\node_modules\electron"
          Get-ChildItem "apps\desktop\node_modules\electron" -ErrorAction SilentlyContinue | Select-Object -First 5 Name
          Write-Host "=== .pnpm 里的 electron ==="
          Get-ChildItem "node_modules\.pnpm" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "electron@*" } | Select-Object -First 5 Name
          Get-ChildItem "apps\desktop\node_modules\.pnpm" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "electron@*" } | Select-Object -First 5 Name
          Write-Host "=== apps/desktop/package.json 里的 electron ==="
          if (Test-Path "apps\desktop\package.json") {
            $pk = Get-Content "apps\desktop\package.json" -Raw | ConvertFrom-Json
            Write-Host ("devDependencies.electron = " + $pk.devDependencies.electron)
            Write-Host ("dependencies.electron = " + $pk.dependencies.electron)
          }
      - name: Write config
        run: |
          $L = @(
          'appId: com.deepseek.harness'
          'productName: DeepSeek Harness'
          'directories:'
          '  output: C:\ebout'
          'win:'
          '  target: appx'
          'appx:'
          '  identityName: 14714BE0.320850A8A419A'
          '  publisher: CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD'
          '  publisherDisplayName: Miku'
          '  displayName: BlueFish'
          '  applicationId: App'
          '  capabilities:'
          '    - runFullTrust'
          '    - internetClient'
          '  languages:'
          '    - en-US'
          '    - zh-CN'
          )
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\eb-appx.yml", ($L -join "`r`n"), (New-Object System.Text.UTF8Encoding $false))
          Get-Content "$env:GITHUB_WORKSPACE\eb-appx.yml"
      - name: Pack with electron-builder
        id: pack
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $d = "${{ steps.inst.outputs.appdir }}"
          New-Item -ItemType Directory -Force -Path "C:\ebout" | Out-Null
          $eb = "$env:GITHUB_WORKSPACE\apps\desktop\node_modules\.bin\electron-builder.cmd"
          if (-not (Test-Path $eb)) { throw "electron-builder not found" }
          Write-Host "=== 在 apps/desktop 下运行 ==="
          Push-Location "apps\desktop"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & $eb --win appx --prepackaged $d --config "$env:GITHUB_WORKSPACE\eb-appx.yml" --publish never *>&1 | Tee-Object "$env:GITHUB_WORKSPACE\p1.log"
          $code = $LASTEXITCODE
          $sw.Stop()
          Pop-Location
          Write-Host "EXIT=$code  elapsed=$([math]::Round($sw.Elapsed.TotalSeconds))s"
          Write-Host "=== C:\ebout ==="
          Get-ChildItem "C:\ebout" -Recurse -ErrorAction SilentlyContinue | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          $appx = Get-ChildItem "C:\ebout" -Recurse -Include *.appx,*.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($appx) {
            Write-Host ("*** SUCCESS " + $appx.FullName + " ***")
            New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist-msix" | Out-Null
            Copy-Item $appx.FullName "$env:GITHUB_WORKSPACE\dist-msix\bluefish.appx" -Force
          } else {
            Write-Host "*** FAILED ***"
            Get-Content "$env:GITHUB_WORKSPACE\p1.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          }
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist-msix/*
          if-no-files-found: warn
          retention-days: 30
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winapp-logs
          path: |
            i*.log
            p*.log
          if-no-files-found: warn
          retention-days: 14
