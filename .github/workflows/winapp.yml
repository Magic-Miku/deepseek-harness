name: WinApp Pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      APPXSIP_LOG: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.2
        continue-on-error: true
      - name: Verify winapp
        run: |
          Get-Command winapp -ErrorAction SilentlyContinue | Select-Object Source
          winapp --help 2>&1 | Select-Object -First 15
          Write-Host "EXIT=$LASTEXITCODE"
      - name: Download exe
        run: |
          curl.exe -L --retry 3 --max-time 1800 -o dsh.exe "https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          $s = (Get-Item dsh.exe).Length
          Write-Host "size = $s"
          if ($s -lt 200MB) { throw "download too small" }
      - name: Extract layer 1
        run: |
          $z = "C:\Program Files\7-Zip\7z.exe"
          New-Item -ItemType Directory -Force -Path "D:\L1" | Out-Null
          & $z x dsh.exe -o"D:\L1" -y 2>&1 | Tee-Object a1.log
          Write-Host "EXIT=$LASTEXITCODE"
      - name: Extract layer 2
        run: |
          $inner = "D:\L1\`$PLUGINSDIR\app-64.7z"
          Write-Host "exists = $(Test-Path $inner)"
          if (-not (Test-Path $inner)) { throw "inner not found" }
          $z = "C:\Program Files\7-Zip\7z.exe"
          New-Item -ItemType Directory -Force -Path "D:\L2" | Out-Null
          & $z x $inner -o"D:\L2" -y 2>&1 | Tee-Object a3.log
          Write-Host "EXIT=$LASTEXITCODE"
          $n = (Get-ChildItem "D:\L2" -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "files = $n"
      - name: Remove bracket files
        if: always()
        run: |
          $log = "a5.log"
          $root = "D:\L2"
          $removed = 0
          $stack = New-Object System.Collections.Stack
          $stack.Push($root)
          while ($stack.Count -gt 0) {
            $dir = $stack.Pop()
            try {
              foreach ($f in [System.IO.Directory]::GetFiles($dir)) {
                $nm = [System.IO.Path]::GetFileName($f)
                if ($nm.Contains("[") -or $nm.Contains("]")) {
                  "REMOVE FILE: $f" | Out-File $log -Append
                  [System.IO.File]::Delete($f)
                  $removed++
                }
              }
              foreach ($d in [System.IO.Directory]::GetDirectories($dir)) {
                $nm = [System.IO.Path]::GetFileName($d)
                if ($nm.Contains("[") -or $nm.Contains("]")) {
                  "REMOVE DIR: $d" | Out-File $log -Append
                  [System.IO.Directory]::Delete($d, $true)
                  $removed++
                } else { $stack.Push($d) }
              }
            } catch { "ERR: $dir $($_.Exception.Message)" | Out-File $log -Append }
          }
          "removed = $removed" | Out-File $log -Append
          Get-Content $log
      - name: Set manifest dir
        id: setdir
        run: |
          $exe = Get-ChildItem "D:\L2" -Recurse -Filter "DeepSeek Harness.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "app exe not found" }
          Write-Host "exe = $($exe.FullName)"
          Write-Host "dir = $($exe.Directory.FullName)"
          "appdir=$($exe.Directory.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
          "exepath=$($exe.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Manifest generate
        continue-on-error: true
        run: |
          $d = "${{ steps.setdir.outputs.appdir }}"
          $e = "${{ steps.setdir.outputs.exepath }}"
          $v = "1.0.$env:GITHUB_RUN_NUMBER.0"
          Write-Host "dir=$d"
          Write-Host "exe=$e"
          Write-Host "ver=$v"
          Push-Location $d
          winapp manifest generate . --package-name "14714BE0.320850A8A419A" --publisher-name "CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD" --version $v --entrypoint $e --logo-path "Assets\StoreLogo.png" --if-exists Overwrite 2>&1 | Tee-Object "D:\m1.log"
          Write-Host "EXIT=$LASTEXITCODE"
          Pop-Location
          Write-Host "=== files in appdir ==="
          Get-ChildItem $d -Filter "*.appxmanifest" -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem $d -Filter "*.xml" -ErrorAction SilentlyContinue | Select-Object Name
      - name: Show manifest
        if: always()
        run: |
          $d = "${{ steps.setdir.outputs.appdir }}"
          $mf = Join-Path $d "Package.appxmanifest"
          if (Test-Path $mf) {
            Write-Host "=== Package.appxmanifest ==="
            Get-Content $mf
          } else {
            Write-Host "NO Package.appxmanifest at $mf"
            Get-Content "D:\m1.log" -ErrorAction SilentlyContinue
          }
      - name: Pack MSIX
        id: pack
        continue-on-error: true
        run: |
          $d = "${{ steps.setdir.outputs.appdir }}"
          New-Item -ItemType Directory -Force -Path "D:\out" | Out-Null
          winapp pack $d --no-sign --output "D:\out\app.msix" 2>&1 | Tee-Object p1.log
          Write-Host "EXIT=$LASTEXITCODE"
          if (Test-Path "D:\out\app.msix") {
            $s = (Get-Item "D:\out\app.msix").Length
            Write-Host "*** MSIX OK $s bytes ***"
            New-Item -ItemType Directory -Force -Path dist-msix | Out-Null
            Copy-Item "D:\out\app.msix" "dist-msix\bluefish.msix" -Force
          } else {
            Write-Host "*** MSIX MISSING ***"
            Get-ChildItem "D:\out" -ErrorAction SilentlyContinue
          }
      - name: Upload msix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist-msix/*
          if-no-files-found: warn
          retention-days: 30
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winapp-logs
          path: |
            a*.log
            p*.log
          if-no-files-found: warn
          retention-days: 14
