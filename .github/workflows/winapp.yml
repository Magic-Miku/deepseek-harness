name: DSH Auto Build
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: force build
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
      hash: ${{ steps.c.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          U="https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          H=$(curl -sIL --max-time 60 "$U")
          L=$(echo "$H" | grep -i '^content-length:' | tail -1 | tr -d '\r' | awk '{print $2}')
          M=$(echo "$H" | grep -i '^last-modified:' | tail -1 | tr -d '\r' | cut -d' ' -f2-)
          N="$L|$M"
          O=""
          [ -f .dsh-hash ] && O=$(cat .dsh-hash | tr -d '\r\n')
          echo "new=$N old=$O"
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$N" != "$O" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "hash=$N" >> $GITHUB_OUTPUT
  build:
    needs: [check]
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          $f = "$env:RUNNER_TEMP\d.exe"
          curl.exe -L --retry 3 --max-time 1800 -o $f "https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          if ((Get-Item $f).Length -lt 200MB) { throw "small" }
          New-Item -ItemType Directory -Force -Path C:\A | Out-Null
          Start-Process $f -ArgumentList "/S","/D=C:\A" -Wait
          Start-Sleep 6
          $e = Get-ChildItem C:\A -Recurse -Filter "DeepSeek Harness.exe" | Select-Object -First 1
          if (-not $e) { throw "no exe" }
          Write-Host "files = $((Get-ChildItem C:\A -Recurse -File -Force).Count)"
      - name: Pack
        run: |
          $d = "C:\A"
          $mk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe"
          $v = "1.0.$env:GITHUB_RUN_NUMBER.0"
          $s = "C:\S"
          New-Item -ItemType Directory -Force -Path $s | Out-Null
          robocopy $d $s /E /NFL /NDL /NP /R:1 /W:1 | Out-Null
          Get-ChildItem $s -Directory -Recurse -Force | Where-Object { $_.Name -eq "_rels" } | ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Host "staged = $((Get-ChildItem $s -Recurse -File -Force).Count)"
          $x = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap" xmlns:mp="http://schemas.microsoft.com/appx/2014/phone/manifest">'
            ('  <Identity Name="14714BE0.320850A8A419A" Publisher="CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD" Version="' + $v + '" />')
            '  <Properties>'
            '    <DisplayName>BlueFish</DisplayName>'
            '    <PublisherDisplayName>Miku</PublisherDisplayName>'
            '    <Description>BlueFish - Electron desktop shell for a bundled dsh runtime and external plugins</Description>'
            '    <Logo>Assets\StoreLogo.png</Logo>'
            '  </Properties>'
            '  <Dependencies>'
            '    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" />'
            '  </Dependencies>'
            '  <Resources>'
            '    <Resource Language="en-us" />'
            '    <Resource Language="zh-cn" />'
            '  </Resources>'
            '  <Applications>'
            '    <Application Id="App" Executable="DeepSeek Harness.exe" EntryPoint="Windows.FullTrustApplication">'
            '      <uap:VisualElements DisplayName="BlueFish" Description="BlueFish - A powerful AI development environment" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">'
            '        <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" Square310x310Logo="Assets\Square310x310Logo.png" Square71x71Logo="Assets\Square71x71Logo.png">'
            '          <uap:ShowNameOnTiles>'
            '            <uap:ShowOn Tile="square150x150Logo" />'
            '            <uap:ShowOn Tile="wide310x150Logo" />'
            '            <uap:ShowOn Tile="square310x310Logo" />'
            '          </uap:ShowNameOnTiles>'
            '        </uap:DefaultTile>'
            '        <uap:SplashScreen Image="Assets\SplashScreen.png" />'
            '        <uap:LockScreen BadgeLogo="Assets\BadgeLogo.png" Notification="badgeAndTileText" />'
            '      </uap:VisualElements>'
            '    </Application>'
            '  </Applications>'
            '  <Capabilities>'
            '    <Capability Name="internetClient" />'
            '    <Capability Name="internetClientServer" />'
            '    <Capability Name="privateNetworkClientServer" />'
            '    <rescap:Capability Name="runFullTrust" />'
            '  </Capabilities>'
            '  <mp:PhoneIdentity PhoneProductId="49e5ab4f-088e-46fc-bf22-b748a9999b08" PhonePublisherId="1bf42279-ce31-40ab-8b3e-fcd19d939971" />'
            '</Package>'
          )
          [IO.File]::WriteAllText("$s\AppxManifest.xml", ($x -join "`n"), (New-Object Text.UTF8Encoding $false))
          $a = "$s\Assets"
          New-Item -ItemType Directory -Force -Path $a | Out-Null
          $src = "$env:GITHUB_WORKSPACE\.github\store-icons"
          $want = @("AppList.png","BadgeLogo.png","LargeTile.png","MediumTile.png","SmallTile.png","SplashScreen.png","Square150x150Logo.png","Square310x310Logo.png","Square44x44Logo.png","Square71x71Logo.png","StoreLogo.png","Wide310x150Logo.png","WideTile.png")
          $ok = 0
          foreach ($n in $want) {
            $p = Join-Path $src $n
            if (Test-Path $p) { Copy-Item $p (Join-Path $a $n) -Force; $ok++ } else { Write-Host "  missing: $n" }
          }
          Write-Host "icons copied = $ok / $($want.Count)"
          if ($ok -lt 13) { throw "icons incomplete: $ok" }
          New-Item -ItemType Directory -Force -Path C:\out | Out-Null
          & $mk pack /d $s /p C:\out\b.appx /o 2>&1 | Tee-Object b.log
          if (-not (Test-Path C:\out\b.appx)) { Get-Content b.log | Select-Object -Last 5; throw "pack failed" }
          $mb = [math]::Round((Get-Item C:\out\b.appx).Length/1MB,1)
          Write-Host "*** OK $mb MB ver=$v ***"
          if ($mb -lt 100) { throw "too small" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item C:\out\b.appx dist\bluefish.appx -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist/*
          retention-days: 90
      - name: Save hash
        if: success()
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          echo "${{ needs.check.outputs.hash }}" > .dsh-hash
          git add .dsh-hash
          git commit -m "hash [skip ci]" || true
          git push || true
      - name: Send email
        if: success()
        shell: pwsh
        run: |
          $runUrl = "https://github.com/Magic-Miku/deepseek-harness/actions/runs/${{ github.run_id }}"
          $L = @(
            "DeepSeek Harness 官方更新了，新包已构建完成。",
            "",
            "版本: 1.0.${{ github.run_number }}.0",
            "大小: 约 382 MB（完整包）",
            "",
            "===== 下载 =====",
            "1. 打开下面链接",
            "2. 拉到页面最底部",
            "3. 点 Artifacts 里的 dsh-msix 下载",
            "",
            $runUrl,
            "",
            "===== 上传商店 =====",
            "1. 打开 https://partner.microsoft.com/dashboard/apps-and-games",
            "2. 点蓝色大肥鱼 -> 更新",
            "3. 上传解压出的 bluefish.appx",
            "4. 提交认证（约 3 个工作日）",
            "",
            "-- GitHub Actions 自动发送"
          )
          $body = $L -join "`r`n"
          $sec = ConvertTo-SecureString "${{ secrets.QQ_AUTH_CODE }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("${{ secrets.QQ_EMAIL }}", $sec)
          Send-MailMessage -SmtpServer "smtp.qq.com" -Port 587 -UseSsl -From "${{ secrets.QQ_EMAIL }}" -To "${{ secrets.QQ_EMAIL }}" -Subject "[DSH] 新版本已就绪，可以发布到商店了" -Body $body -Encoding UTF8 -Credential $cred
          Write-Host "邮件已发送"
