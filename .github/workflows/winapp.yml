name: DSH Auto Build
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: force build
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
      hash: ${{ steps.c.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          U="https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          H=$(curl -sIL --max-time 60 "$U")
          L=$(echo "$H" | grep -i '^content-length:' | tail -1 | tr -d '\r' | awk '{print $2}')
          M=$(echo "$H" | grep -i '^last-modified:' | tail -1 | tr -d '\r' | cut -d' ' -f2-)
          N="$L|$M"
          O=""
          [ -f .dsh-hash ] && O=$(cat .dsh-hash | tr -d '\r\n')
          echo "new=$N old=$O"
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$N" != "$O" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "hash=$N" >> $GITHUB_OUTPUT
  build:
    needs: [check]
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          $f = "$env:RUNNER_TEMP\d.exe"
          curl.exe -L --retry 3 --max-time 1800 -o $f "https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          if ((Get-Item $f).Length -lt 200MB) { throw "small" }
          New-Item -ItemType Directory -Force -Path C:\A | Out-Null
          Start-Process $f -ArgumentList "/S","/D=C:\A" -Wait
          Start-Sleep 6
          $e = Get-ChildItem C:\A -Recurse -Filter "DeepSeek Harness.exe" | Select-Object -First 1
          if (-not $e) { throw "no exe" }
          Write-Host "files = $((Get-ChildItem C:\A -Recurse -File -Force).Count)"
      - name: Pack
        run: |
          $d = "C:\A"
          $mk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe"
          $v = "1.0.$env:GITHUB_RUN_NUMBER.0"
          $s = "C:\S"
          New-Item -ItemType Directory -Force -Path $s | Out-Null
          robocopy $d $s /E /NFL /NDL /NP /R:1 /W:1 | Out-Null
          Get-ChildItem $s -Directory -Recurse -Force | Where-Object { $_.Name -eq "_rels" } | ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Host "staged = $((Get-ChildItem $s -Recurse -File -Force).Count)"
          $a = "$s\Assets"
          New-Item -ItemType Directory -Force -Path $a | Out-Null
          $ic = "$env:GITHUB_WORKSPACE\.github\store-icons"
          Copy-Item "$ic\StoreLogo.png" "$a\StoreLogo.png" -Force
          Copy-Item "$ic\Square150x150Logo.png" "$a\Square150x150Logo.png" -Force
          Copy-Item "$ic\Square44x44Logo.png" "$a\Square44x44Logo.png" -Force
          $pdn = [char]0xD835 + [char]0xDD78 + 'ik' + [char]0x0E19 + [char]0x795E + [char]0x6559 + [char]0x2728 + [char]0x6559 + [char]0x4E3B
          Write-Host "PublisherDisplayName = $pdn   (len=$($pdn.Length))"
          $x = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap">'
            ('  <Identity Name="14714BE0.320850A8A419A" Publisher="CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD" Version="' + $v + '" />')
            '  <Properties>'
            '    <DisplayName>BlueFish</DisplayName>'
            ('    <PublisherDisplayName>' + $pdn + '</PublisherDisplayName>')
            '    <Logo>Assets\StoreLogo.png</Logo>'
            '  </Properties>'
            '  <Dependencies>'
            '    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" />'
            '  </Dependencies>'
            '  <Resources>'
            '    <Resource Language="en-us" />'
            '    <Resource Language="zh-cn" />'
            '  </Resources>'
            '  <Applications>'
            '    <Application Id="App" Executable="DeepSeek Harness.exe" EntryPoint="Windows.FullTrustApplication">'
            '      <uap:VisualElements DisplayName="BlueFish" Description="BlueFish" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" />'
            '    </Application>'
            '  </Applications>'
            '  <Capabilities>'
            '    <Capability Name="internetClient" />'
            '    <rescap:Capability Name="runFullTrust" />'
            '  </Capabilities>'
            '</Package>'
          )
          [IO.File]::WriteAllText("$s\AppxManifest.xml", ($x -join "`n"), (New-Object Text.UTF8Encoding $false))
          New-Item -ItemType Directory -Force -Path C:\out | Out-Null
          & $mk pack /d $s /p C:\out\b.appx /o 2>&1 | Tee-Object b.log
          if (-not (Test-Path C:\out\b.appx)) { Get-Content b.log | Select-Object -Last 5; throw "pack failed" }
          $mb = [math]::Round((Get-Item C:\out\b.appx).Length/1MB,1)
          Write-Host "*** OK $mb MB ver=$v ***"
          if ($mb -lt 100) { throw "too small" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item C:\out\b.appx dist\bluefish.appx -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist/*
          retention-days: 90
      - name: Save hash
        if: success()
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          echo "${{ needs.check.outputs.hash }}" > .dsh-hash
          git add .dsh-hash
          git commit -m "hash [skip ci]" || true
          git push || true
      - name: Send email
        if: success()
        shell: pwsh
        run: |
          $runUrl = "https://github.com/Magic-Miku/deepseek-harness/actions/runs/${{ github.run_id }}"
          $L = @(
            "DeepSeek Harness 官方更新了，新包已构建完成。",
            "",
            "版本: 1.0.${{ github.run_number }}.0",
            "",
            "下载: " + $runUrl,
            "",
            "上传商店: https://partner.microsoft.com/dashboard/apps-and-games"
          )
          $body = $L -join "`r`n"
          $sec = ConvertTo-SecureString "${{ secrets.QQ_AUTH_CODE }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("${{ secrets.QQ_EMAIL }}", $sec)
          Send-MailMessage -SmtpServer "smtp.qq.com" -Port 587 -UseSsl -From "${{ secrets.QQ_EMAIL }}" -To "${{ secrets.QQ_EMAIL }}" -Subject "[DSH] 新版本已就绪" -Body $body -Encoding UTF8 -Credential $cred
