name: DSH Auto Build
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: force build
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
      hash: ${{ steps.c.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          U="https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          H=$(curl -sIL --max-time 60 "$U")
          L=$(echo "$H" | grep -i '^content-length:' | tail -1 | tr -d '\r' | awk '{print $2}')
          M=$(echo "$H" | grep -i '^last-modified:' | tail -1 | tr -d '\r' | cut -d' ' -f2-)
          N="$L|$M"
          O=""
          [ -f .dsh-hash ] && O=$(cat .dsh-hash | tr -d '\r\n')
          echo "new=$N old=$O force=${{ github.event.inputs.force }}"
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$N" != "$O" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "hash=$N" >> $GITHUB_OUTPUT
  build:
    needs: [check]
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install
        id: i
        run: |
          $f = "$env:RUNNER_TEMP\d.exe"
          curl.exe -L --retry 3 --max-time 1800 -o $f "https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          if ((Get-Item $f).Length -lt 200MB) { throw "small" }
          New-Item -ItemType Directory -Force -Path C:\A | Out-Null
          Start-Process $f -ArgumentList "/S","/D=C:\A" -Wait
          Start-Sleep 6
          $e = Get-ChildItem C:\A -Recurse -Filter "DeepSeek Harness.exe" | Select-Object -First 1
          if (-not $e) { throw "no exe" }
          Write-Host "files = $((Get-ChildItem C:\A -Recurse -File -Force).Count)"
          "d=C:\A" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Pack
        run: |
          $d = "${{ steps.i.outputs.d }}"
          $mk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe"
          $v = "1.0.$env:GITHUB_RUN_NUMBER.0"
          $s = "C:\S"
          New-Item -ItemType Directory -Force -Path $s | Out-Null
          robocopy $d $s /E /NFL /NDL /NP /R:1 /W:1 | Out-Null
          Get-ChildItem $s -Directory -Recurse -Force | Where-Object { $_.Name -eq "_rels" } | ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Host "staged = $((Get-ChildItem $s -Recurse -File -Force).Count)"
          $x = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap">'
            ('<Identity Name="14714BE0.320850A8A419A" Publisher="CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD" Version="' + $v + '" ProcessorArchitecture="x64" />')
            '<Properties><DisplayName>BlueFish</DisplayName><PublisherDisplayName>Miku</PublisherDisplayName><Logo>Assets\StoreLogo.png</Logo></Properties>'
            '<Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" /></Dependencies>'
            '<Resources><Resource Language="en-us" /></Resources>'
            '<Capabilities><Capability Name="internetClient" /><rescap:Capability Name="runFullTrust" /></Capabilities>'
            '<Applications><Application Id="App" Executable="DeepSeek Harness.exe" EntryPoint="Windows.FullTrustApplication">'
            '<uap:VisualElements DisplayName="BlueFish" Description="BlueFish" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" />'
            '</Application></Applications></Package>'
          )
          [IO.File]::WriteAllText("$s\AppxManifest.xml", ($x -join "`n"), (New-Object Text.UTF8Encoding $false))
          $a = "$s\Assets"
          New-Item -ItemType Directory -Force -Path $a | Out-Null
          Add-Type -AssemblyName System.Drawing
          50,44,150 | ForEach-Object { $b = New-Object Drawing.Bitmap $_,$_; $g=[Drawing.Graphics]::FromImage($b); $g.Clear([Drawing.Color]::FromArgb(58,95,170)); $b.Save("$a\L$_.png",[Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $b.Dispose() }
          Copy-Item "$a\L50.png" "$a\StoreLogo.png" -Force
          Copy-Item "$a\L44.png" "$a\Square44x44Logo.png" -Force
          Copy-Item "$a\L150.png" "$a\Square150x150Logo.png" -Force
          $b = New-Object Drawing.Bitmap 310,150
          $g = [Drawing.Graphics]::FromImage($b); $g.Clear([Drawing.Color]::FromArgb(58,95,170))
          $b.Save("$a\Wide310x150Logo.png",[Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $b.Dispose()
          New-Item -ItemType Directory -Force -Path C:\out | Out-Null
          & $mk pack /d $s /p C:\out\b.appx /o 2>&1 | Tee-Object b.log
          if (-not (Test-Path C:\out\b.appx)) { Get-Content b.log | Select-Object -Last 5; throw "pack failed" }
          $mb = [math]::Round((Get-Item C:\out\b.appx).Length/1MB,1)
          Write-Host "*** OK $mb MB ver=$v ***"
          if ($mb -lt 100) { throw "too small" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item C:\out\b.appx dist\bluefish.appx -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist/*
          retention-days: 30
      - name: Save hash
        if: success()
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          echo "${{ needs.check.outputs.hash }}" > .dsh-hash
          git add .dsh-hash
          git commit -m "hash [skip ci]" || true
          git push || true
  publish:
    needs: [build]
    if: needs.build.result == 'success' && secrets.STORE_PRODUCT_ID != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/microsoft-store-apppublisher@v1.1
      - run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      - uses: actions/download-artifact@v4
        with:
          name: dsh-msix
          path: ./r
      - shell: pwsh
        run: |
          $p = Get-ChildItem ./r -Include *.appx,*.msix -Recurse | Select-Object -First 1
          msstore publish "$($p.FullName)" -id ${{ secrets.STORE_PRODUCT_ID }} --packageRolloutPercentage 5
