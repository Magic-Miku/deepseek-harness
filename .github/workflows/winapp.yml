name: DSH Auto Build
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: force build
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
      hash: ${{ steps.c.outputs.hash }}
      size: ${{ steps.c.outputs.size }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: c
        run: |
          set -o pipefail
          U="https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          H=$(curl -sIL --max-time 60 --retry 3 "$U")
          LEN=$(echo "$H" | grep -i '^content-length:' | tail -1 | tr -d '\r' | awk '{print $2}')
          ETAG=$(echo "$H" | grep -i '^etag:' | tail -1 | tr -d '\r' | sed 's/^[Ee][Tt][Aa][Gg]: *//')
          LM=$(echo "$H" | grep -i '^last-modified:' | tail -1 | tr -d '\r' | cut -d' ' -f2-)
          if [ -z "$LEN" ]; then
            echo "::error::无法获取上游 content-length"
            exit 1
          fi
          if [ -n "$ETAG" ]; then
            N="$LEN|$ETAG"
          else
            N="$LEN|$LM"
          fi
          O=""
          [ -f .dsh-hash ] && O=$(cat .dsh-hash | tr -d '\r\n')
          echo "current  = $N"
          echo "recorded = $O"
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$N" != "$O" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "hash=$N" >> $GITHUB_OUTPUT
          echo "size=$LEN" >> $GITHUB_OUTPUT
      - name: Heartbeat
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '%s | changed=%s | %s\n' "$TS" "${{ steps.c.outputs.changed }}" "${{ steps.c.outputs.hash }}" > .dsh-heartbeat
          git add .dsh-heartbeat
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: heartbeat [skip ci]"
          git pull --rebase --autostash origin master || echo "rebase failed"
          git push || echo "push failed"
      - name: Prune old artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== 当前 artifact ==="
          gh api "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | "\(.id) \(.created_at) \(.name)"' > /tmp/arts.txt || true
          COUNT=$(wc -l < /tmp/arts.txt)
          echo "总数: $COUNT"
          while read -r ID REST; do
            [ -z "$ID" ] && continue
            echo "删除 artifact $ID"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$ID" || true
          done < /tmp/arts.txt
          echo "=== 清理后 ==="
          gh api "repos/$REPO/actions/artifacts?per_page=100" --jq '"剩余 \(.total_count) 个"' || true
  build:
    needs: [check]
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download upstream
        run: |
          $f = "$env:RUNNER_TEMP\dsh-setup.exe"
          Remove-Item $f -Force -ErrorAction SilentlyContinue
          curl.exe -L --retry 5 --retry-delay 5 --retry-all-errors --max-time 2400 -o $f "https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          if (-not (Test-Path $f)) { throw "download failed: file missing" }
          $sz = (Get-Item $f).Length
          $want = [int64]"${{ needs.check.outputs.size }}"
          Write-Host "downloaded = $sz bytes (upstream $want)"
          if ($sz -lt 200MB) { throw "download too small: $sz" }
          if ($sz -ne $want) { throw "size mismatch: got $sz, expected $want" }
          Write-Host "download OK"
      - name: Silent install
        run: |
          $f = "$env:RUNNER_TEMP\dsh-setup.exe"
          $t = "C:\A"
          if (Test-Path $t) { Remove-Item $t -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          $p = Start-Process $f -ArgumentList "/S","/D=$t" -Wait -PassThru
          Write-Host "installer exit = $($p.ExitCode)"
          $deadline = (Get-Date).AddMinutes(8)
          $exe = $null
          $lastCount = -1
          $stableRounds = 0
          while ((Get-Date) -lt $deadline) {
            $all = @(Get-ChildItem $t -Recurse -File -Force -ErrorAction SilentlyContinue)
            $n = $all.Count
            if (-not $exe) {
              $exe = $all | Where-Object { $_.Name -eq "DeepSeek Harness.exe" } | Select-Object -First 1
            }
            if ($exe -and $n -eq $lastCount) {
              $stableRounds++
              if ($stableRounds -ge 3) {
                Write-Host "文件数已稳定 ($n)，停止等待"
                break
              }
            } else {
              $stableRounds = 0
            }
            $lastCount = $n
            Start-Sleep 5
          }
          $final = @(Get-ChildItem $t -Recurse -File -Force -ErrorAction SilentlyContinue)
          Write-Host "files = $($final.Count)"
          if (-not $exe) { throw "DeepSeek Harness.exe not found after install" }
          if ($final.Count -lt 9000) { throw "too few files: $($final.Count) (expected ~9700)" }
          Write-Host "install OK: $($exe.FullName)"
      - name: Pack
        id: pack
        run: |
          $d = "C:\A"
          $mk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe"
          if (-not (Test-Path $mk)) {
            $mk = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter makeappx.exe -Recurse -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          if (-not (Test-Path $mk)) { throw "makeappx not found" }
          Write-Host "makeappx = $mk"
          $v = "1.0.$env:GITHUB_RUN_NUMBER.0"
          $s = "C:\S"
          if (Test-Path $s) { Remove-Item $s -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $s | Out-Null
          robocopy $d $s /E /NFL /NDL /NP /R:2 /W:2 | Out-Null
          Get-ChildItem $s -Directory -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "_rels" } |
            ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          $staged = @(Get-ChildItem $s -Recurse -File -Force -ErrorAction SilentlyContinue)
          Write-Host "staged = $($staged.Count)"
          if ($staged.Count -lt 9000) { throw "staging incomplete: $($staged.Count)" }

          # ================= 图标：从 source.png 现生成 =================
          $a = "$s\Assets"
          New-Item -ItemType Directory -Force -Path $a | Out-Null
          $srcIcon = "$env:GITHUB_WORKSPACE\.github\store-icons\source.png"
          if (Test-Path $srcIcon) {
            Write-Host "generating icons from source.png"
            Add-Type -AssemblyName System.Drawing
            $srcImg = [System.Drawing.Image]::FromFile($srcIcon)
            Write-Host ("source: {0}x{1}" -f $srcImg.Width, $srcImg.Height)
            function New-Icon([string]$Path, [int]$W, [int]$H) {
              $bmp = New-Object System.Drawing.Bitmap($W, $H)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
              $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
              $sw = $srcImg.Width; $sh = $srcImg.Height
              $scale = [Math]::Max($W / [double]$sw, $H / [double]$sh)
              $nw = [Math]::Max($W, [int][Math]::Round($sw * $scale))
              $nh = [Math]::Max($H, [int][Math]::Round($sh * $scale))
              $left = [int](($nw - $W) / 2); $top = [int](($nh - $H) / 2)
              $dstRect = New-Object System.Drawing.Rectangle(-$left, -$top, $nw, $nh)
              $g.Clear([System.Drawing.Color]::White)
              $g.DrawImage($srcImg, $dstRect)
              $g.Dispose()
              $bmp.Save($Path, [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
            }
            New-Icon (Join-Path $a "StoreLogo.png")          50  50
            New-Icon (Join-Path $a "Square44x44Logo.png")    44  44
            New-Icon (Join-Path $a "Square71x71Logo.png")    71  71
            New-Icon (Join-Path $a "Square150x150Logo.png")  150 150
            New-Icon (Join-Path $a "Square310x310Logo.png")  310 310
            New-Icon (Join-Path $a "Wide310x150Logo.png")    310 150
            New-Icon (Join-Path $a "SplashScreen.png")       620 300
            New-Icon (Join-Path $a "BadgeLogo.png")          24  24
            foreach ($t in @(24, 48, 64, 256)) {
              foreach ($suf in @("", "_altform-unplated", "_altform-lightunplated")) {
                New-Icon (Join-Path $a ("Square44x44Logo.targetsize-$t$suf.png")) $t $t
              }
            }
            $srcImg.Dispose()
          } else {
            throw "source.png not found at $srcIcon"
          }

          $iconN = @(Get-ChildItem $a -Recurse -File -Force -ErrorAction SilentlyContinue).Count
          Write-Host "icons = $iconN"
          if ($iconN -lt 15) { throw "too few icons: $iconN (expected >=15)" }
          $need = @("StoreLogo.png","Square44x44Logo.png","Square150x150Logo.png","Square310x310Logo.png","Square71x71Logo.png","Wide310x150Logo.png","SplashScreen.png","BadgeLogo.png")
          foreach ($n in $need) { if (-not (Test-Path (Join-Path $a $n))) { throw "required icon missing: $n" } }
          foreach ($t in @(24,48,64,256)) {
            foreach ($suf in @("","_altform-unplated","_altform-lightunplated")) {
              $fn = "Square44x44Logo.targetsize-$t$suf.png"
              if (-not (Test-Path (Join-Path $a $fn))) { throw "targetsize asset missing: $fn" }
            }
          }
          Write-Host "all required icon assets present (8 base + 12 targetsize)"

          $pdn = [char]0xD835 + [char]0xDD78 + 'ik' + [char]0x0E19 + [char]0x795E + [char]0x6559 + [char]0x2728 + [char]0x6559 + [char]0x4E3B
          $x = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap" xmlns:mp="http://schemas.microsoft.com/appx/2014/phone/manifest">'
            ('  <Identity Name="14714BE0.320850A8A419A" Publisher="CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD" Version="' + $v + '" />')
            '  <Properties>'
            '    <DisplayName>蓝色大肥鱼</DisplayName>'
            ('    <PublisherDisplayName>' + $pdn + '</PublisherDisplayName>')
            '    <Description>蓝色大肥鱼 - Electron desktop shell for a bundled dsh runtime and external plugins</Description>'
            '    <Logo>Assets\StoreLogo.png</Logo>'
            '  </Properties>'
            '  <Dependencies>'
            '    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" />'
            '  </Dependencies>'
            '  <Resources>'
            '    <Resource Language="en-us" />'
            '    <Resource Language="zh-cn" />'
            '  </Resources>'
            '  <Applications>'
            '    <Application Id="App" Executable="DeepSeek Harness.exe" EntryPoint="Windows.FullTrustApplication">'
            '      <uap:VisualElements DisplayName="蓝色大肥鱼" Description="蓝色大肥鱼 - A powerful AI development environment" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">'
            '        <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" Square310x310Logo="Assets\Square310x310Logo.png" Square71x71Logo="Assets\Square71x71Logo.png">'
            '          <uap:ShowNameOnTiles>'
            '            <uap:ShowOn Tile="square150x150Logo" />'
            '            <uap:ShowOn Tile="wide310x150Logo" />'
            '            <uap:ShowOn Tile="square310x310Logo" />'
            '          </uap:ShowNameOnTiles>'
            '        </uap:DefaultTile>'
            '        <uap:SplashScreen Image="Assets\SplashScreen.png" />'
            '        <uap:LockScreen BadgeLogo="Assets\BadgeLogo.png" Notification="badgeAndTileText" />'
            '      </uap:VisualElements>'
            '    </Application>'
            '  </Applications>'
            '  <Capabilities>'
            '    <Capability Name="internetClient" />'
            '    <Capability Name="internetClientServer" />'
            '    <Capability Name="privateNetworkClientServer" />'
            '    <rescap:Capability Name="runFullTrust" />'
            '  </Capabilities>'
            '  <mp:PhoneIdentity PhoneProductId="49e5ab4f-088e-46fc-bf22-b748a9999b08" PhonePublisherId="1bf42279-ce31-40ab-8b3e-fcd19d939971" />'
            '</Package>'
          )
          [IO.File]::WriteAllText("$s\AppxManifest.xml", ($x -join "`n"), (New-Object Text.UTF8Encoding $false))

          # ================= 生成 resources.pri（targetsize 靠它索引） =================
          $priOk = $false
          $mp = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makepri.exe"
          if (-not (Test-Path $mp)) {
            $mp = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter makepri.exe -Recurse -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          if ($mp -and (Test-Path $mp)) {
            $pricfgLines = @(
              '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
              '<resources targetOsVersion="10.0.0" majorVersion="1">',
              '  <packaging>',
              '    <autoResourcePackage qualifier="Language"/>',
              '    <autoResourcePackage qualifier="Scale"/>',
              '    <autoResourcePackage qualifier="DXFeatureLevel"/>',
              '  </packaging>',
              '  <index root="\" startIndexAt="\">',
              '    <default>',
              '      <qualifier name="Language" value="en-US"/>',
              '      <qualifier name="Contrast" value="standard"/>',
              '      <qualifier name="Scale" value="100"/>',
              '      <qualifier name="HomeRegion" value="001"/>',
              '      <qualifier name="TargetSize" value="256"/>',
              '      <qualifier name="LayoutDirection" value="LTR"/>',
              '      <qualifier name="Theme" value="dark"/>',
              '      <qualifier name="AlternateForm" value=""/>',
              '      <qualifier name="DXFeatureLevel" value="DX9"/>',
              '      <qualifier name="Configuration" value=""/>',
              '      <qualifier name="DeviceFamily" value="Universal"/>',
              '      <qualifier name="Custom" value=""/>',
              '    </default>',
              '    <indexer-config type="folder" foldernameAsQualifier="true" filenameAsQualifier="true" qualifierDelimiter="."/>',
              '    <indexer-config type="resw" convertDotsToSlashes="true" initialPath=""/>',
              '    <indexer-config type="resjson" initialPath=""/>',
              '    <indexer-config type="PRI"/>',
              '  </index>',
              '</resources>'
            )
            $cfgPath = "$s\priconfig.xml"
            [IO.File]::WriteAllText($cfgPath, ($pricfgLines -join "`n"), (New-Object Text.UTF8Encoding $false))
            $priPath = "$s\resources.pri"
            $priLog = & $mp new /pr $s /cf $cfgPath /mn "$s\AppxManifest.xml" /of $priPath /o 2>&1 | Out-String
            $cand = ($priLog -split "`n" | Where-Object { $_ -match "Resource Candidates" } | ForEach-Object { $_.Trim() }) -join " "
            Write-Host "makepri: $cand"
            if (-not (Test-Path $priPath)) {
              Write-Host "WARNING: resources.pri NOT created"
              $priLog -split "`n" | ForEach-Object { if ($_.Trim()) { Write-Host "   " + $_.Trim() } }
            } else {
              $priOk = $true
              Write-Host "resources.pri = $((Get-Item $priPath).Length) bytes"
              Remove-Item $cfgPath -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "WARNING: makepri.exe not found"
          }
          Write-Host "=== pri=$priOk ==="

          $out = "C:\out"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $mk pack /d $s /p "$out\b.appx" /o 2>&1 | Tee-Object b.log
          if (-not (Test-Path "$out\b.appx")) { Get-Content b.log | Select-Object -Last 8; throw "pack failed" }
          $mb = [math]::Round((Get-Item "$out\b.appx").Length/1MB,1)
          Write-Host "*** OK $mb MB ver=$v icons=$iconN pri=$priOk ***"
          if ($mb -lt 100) { throw "too small: $mb MB" }
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item "$out\b.appx" "dist\bluefish.appx" -Force
          "ver=$v" | Out-File -Append $env:GITHUB_OUTPUT
          "mb=$mb" | Out-File -Append $env:GITHUB_OUTPUT
          "icons=$iconN" | Out-File -Append $env:GITHUB_OUTPUT
          "pri=$priOk" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Publish Release (latest)
        id: rel
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "latest"
          $v = "1.0.$env:GITHUB_RUN_NUMBER.0"
          Write-Host "publishing latest (version $v)"
          gh release delete $tag --repo $repo --yes --cleanup-tag 2>$null
          gh release create $tag "dist\bluefish.appx" `
            --repo $repo `
            --title "蓝色大肥鱼 $v（最新）" `
            --notes "版本: $v`nicons: ${{ steps.pack.outputs.icons }}`npri: ${{ steps.pack.outputs.pri }}`nfrom: DeepSeek upstream`nbuild: ${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          $url = "https://github.com/$repo/releases/download/$tag/bluefish.appx"
          Write-Host "DIRECT URL = $url"
          "url=$url" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Upload artifact (fallback only)
        if: steps.rel.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist/*
          if-no-files-found: warn
          retention-days: 7
      - name: Save hash
        if: success()
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          echo "${{ needs.check.outputs.hash }}" > .dsh-hash
          git add .dsh-hash
          git diff --cached --quiet && echo "hash unchanged" && exit 0
          git commit -m "hash [skip ci]"
          git pull --rebase --autostash origin master || echo "rebase failed"
          git push || echo "push failed"
      - name: Email success
        if: success()
        shell: pwsh
        run: |
          $url = "${{ steps.rel.outputs.url }}"
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if (-not $url) {
            $url = "(Release 未生成，请到 Actions 页下载 artifact)`n$runUrl"
          }
          $L = @(
            "DeepSeek Harness 新包已构建完成。",
            "",
            "版本: 1.0.${{ github.run_number }}.0",
            "大小: ${{ steps.pack.outputs.mb }} MB",
            "图标: ${{ steps.pack.outputs.icons }} 个（source.png 现生成）",
            "resources.pri: ${{ steps.pack.outputs.pri }}",
            "",
            "===== 第 1 步：下载 =====",
            "",
            "点这个链接（浏览器立即开始下载，永远是最新版）：",
            "",
            $url,
            "",
            "===== 第 2 步：上传商店 =====",
            "",
            "打开下面链接（直达蓝色大肥鱼页面）：",
            "https://partner.microsoft.com/zh-cn/dashboard/products/9PCP6XTPQJTG/overview",
            "",
            "然后：",
            "  1. 点右上角的【更新】按钮",
            "  2. 上传刚下载的 bluefish.appx",
            "  3. 提交认证（约 3 个工作日）",
            "",
            "-- GitHub Actions 自动发送"
          )
          $body = $L -join "`r`n"
          $sec = ConvertTo-SecureString "${{ secrets.QQ_AUTH_CODE }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("${{ secrets.QQ_EMAIL }}", $sec)
          Send-MailMessage -SmtpServer "smtp.qq.com" -Port 587 -UseSsl -From "${{ secrets.QQ_EMAIL }}" -To "${{ secrets.QQ_EMAIL }}" -Subject "[DSH] 新版本已就绪，可以发布到商店了" -Body $body -Encoding UTF8 -Credential $cred
          Write-Host "success mail sent"
      - name: Email failure
        if: failure()
        shell: pwsh
        run: |
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $L = @(
            "DSH 自动构建失败了，需要你检查一下。",
            "",
            "版本: 1.0.${{ github.run_number }}.0",
            "上游指纹: ${{ needs.check.outputs.hash }}",
            "",
            "常见原因:",
            "  1. DeepSeek 改了安装包结构",
            "  2. 下载中断或大小不符",
            "  3. 安装未完成",
            "  4. makeappx 打包失败",
            "  5. 图标生成失败（source.png 缺失或损坏）",
            "",
            "查看日志:",
            $runUrl,
            "",
            "-- GitHub Actions 自动发送"
          )
          $body = $L -join "`r`n"
          $sec = ConvertTo-SecureString "${{ secrets.QQ_AUTH_CODE }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("${{ secrets.QQ_EMAIL }}", $sec)
          Send-MailMessage -SmtpServer "smtp.qq.com" -Port 587 -UseSsl -From "${{ secrets.QQ_EMAIL }}" -To "${{ secrets.QQ_EMAIL }}" -Subject "[DSH] 构建失败，需要检查" -Body $body -Encoding UTF8 -Credential $cred
          Write-Host "failure mail sent"
