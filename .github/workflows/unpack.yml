name: Unpack Package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download exe
        run: |
          curl.exe -L --retry 3 --retry-delay 5 --max-time 1800 -o dsh.exe "https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe"
          $s = (Get-Item dsh.exe).Length
          Write-Host "downloaded = $s bytes"
          if ($s -lt 200MB) { throw "download too small" }
      - name: Extract layer 1
        run: |
          $z = "C:\Program Files\7-Zip\7z.exe"
          New-Item -ItemType Directory -Force -Path "D:\L1" | Out-Null
          & $z x dsh.exe -o"D:\L1" -y 2>&1 | Tee-Object a1.log
          Write-Host "EXIT=$LASTEXITCODE"
          Get-ChildItem "D:\L1" -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
      - name: Extract layer 2
        id: L2
        continue-on-error: true
        run: |
          $inner = "D:\L1\`$PLUGINSDIR\app-64.7z"
          Write-Host "inner = $inner"
          Write-Host "exists = $(Test-Path $inner)"
          if (-not (Test-Path $inner)) { Write-Host "INNER NOT FOUND"; exit }
          $z = "C:\Program Files\7-Zip\7z.exe"
          New-Item -ItemType Directory -Force -Path "D:\L2" | Out-Null
          & $z x $inner -o"D:\L2" -y 2>&1 | Tee-Object a3.log
          Write-Host "EXIT=$LASTEXITCODE"
          Get-ChildItem "D:\L2" | Select-Object Name | Format-Table -AutoSize
      - name: Inspect
        if: always()
        run: |
          $log = "a4.log"
          "=== L2 top ===" | Out-File $log
          Get-ChildItem "D:\L2" -ErrorAction SilentlyContinue | Select-Object Name | Format-Table -AutoSize | Out-String | Out-File $log -Append
          "" | Out-File $log -Append
          "=== DeepSeek Harness.exe ===" | Out-File $log -Append
          Get-ChildItem "D:\L2" -Recurse -Filter "DeepSeek Harness.exe" -ErrorAction SilentlyContinue | Select-Object -First 3 -ExpandProperty FullName | Out-File $log -Append
          "" | Out-File $log -Append
          "=== app.asar ===" | Out-File $log -Append
          Get-ChildItem "D:\L2" -Recurse -Filter "app.asar" -ErrorAction SilentlyContinue | Select-Object -First 3 -ExpandProperty FullName | Out-File $log -Append
          "" | Out-File $log -Append
          "files=" + (Get-ChildItem "D:\L2" -Recurse -File -ErrorAction SilentlyContinue).Count | Out-File $log -Append
          "" | Out-File $log -Append
          "=== bracket files ===" | Out-File $log -Append
          Get-ChildItem "D:\L2" -Recurse -File -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '\[|\]' } | Select-Object -First 10 -ExpandProperty FullName | Out-File $log -Append
          Get-Content $log
      - name: Pack MSIX
        continue-on-error: true
        run: |
          $exe = Get-ChildItem "D:\L2" -Recurse -Filter "DeepSeek Harness.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "NO APP EXE"; exit }
          $appdir = $exe.Directory.FullName
          Write-Host "appdir = $appdir"
          New-Item -ItemType Directory -Force -Path "$appdir\Assets" | Out-Null
          Add-Type -AssemblyName System.Drawing
          function I($w,$h,$o) {
            $b = New-Object System.Drawing.Bitmap $w,$h
            $g = [System.Drawing.Graphics]::FromImage($b)
            $g.Clear([System.Drawing.Color]::FromArgb(58,95,170))
            $b.Save($o, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $b.Dispose()
          }
          I 50 50 "$appdir\Assets\StoreLogo.png"
          I 44 44 "$appdir\Assets\Square44x44Logo.png"
          I 150 150 "$appdir\Assets\Square150x150Logo.png"
          I 310 150 "$appdir\Assets\Wide310x150Logo.png"
          $v = "1.0.$env:GITHUB_RUN_NUMBER.0"
          $x = @(
          '<?xml version="1.0" encoding="utf-8"?>'
          '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap">'
          ('  <Identity Name="14714BE0.320850A8A419A" Version="' + $v + '" Publisher="CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD" ProcessorArchitecture="x64" />')
          '  <Properties><DisplayName>BlueFish</DisplayName><PublisherDisplayName>Miku</PublisherDisplayName><Logo>Assets\StoreLogo.png</Logo></Properties>'
          '  <Resources><Resource Language="en-us" /></Resources>'
          '  <Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" /></Dependencies>'
          '  <Capabilities><rescap:Capability Name="runFullTrust" /><Capability Name="internetClient" /></Capabilities>'
          '  <Applications><Application Id="App" Executable="DeepSeek Harness.exe" EntryPoint="Windows.FullTrustApplication">'
          '    <uap:VisualElements DisplayName="BlueFish" Description="BlueFish" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" BackgroundColor="transparent" />'
          '  </Application></Applications>'
          '</Package>'
          )
          [System.IO.File]::WriteAllText("$appdir\AppxManifest.xml", ($x -join "`r`n"), (New-Object System.Text.UTF8Encoding $false))
          $bad = Get-ChildItem $appdir -Recurse -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '\[|\]' }
          Write-Host "bracket files = $($bad.Count)"
          $bad | Remove-Item -Force -ErrorAction SilentlyContinue
          $mk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe"
          New-Item -ItemType Directory -Force -Path "D:\o" | Out-Null
          & $mk pack /d $appdir /p "D:\o\bf.appx" /o /nc 2>&1 | Tee-Object p1.log
          Write-Host "EXIT=$LASTEXITCODE"
          if (Test-Path "D:\o\bf.appx") {
            $s = (Get-Item "D:\o\bf.appx").Length
            Write-Host "*** APPX OK $s bytes ***"
            New-Item -ItemType Directory -Force -Path dist-msix | Out-Null
            Copy-Item "D:\o\bf.appx" "dist-msix\bluefish.appx" -Force
          } else {
            Write-Host "*** APPX MISSING ***"
            Get-Content p1.log -ErrorAction SilentlyContinue | Select-Object -Last 15
          }
      - name: Upload appx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist-msix/*.appx
          if-no-files-found: warn
          retention-days: 30
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpack-logs
          path: |
            a*.log
            p*.log
          if-no-files-found: warn
          retention-days: 14
