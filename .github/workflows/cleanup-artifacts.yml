name: Cleanup Artifacts
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== 删除前: 列出所有 artifact ==="
          TOTAL=$(gh api "repos/$REPO/actions/artifacts?per_page=100" --jq '.total_count')
          echo "共 $TOTAL 个"
          gh api "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | "  \(.id)  \(.name)  \((.size_in_bytes/1048576)|floor) MB"'

          echo ""
          echo "=== 开始删除 ==="
          DELETED=0
          FAILED=0
          for ID in $(gh api "repos/$REPO/actions/artifacts?per_page=100" --paginate --jq '.artifacts[].id'); do
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$ID" 2>/dev/null; then
              DELETED=$((DELETED+1))
            else
              FAILED=$((FAILED+1))
            fi
          done
          echo "已删除: $DELETED"
          echo "失败:   $FAILED"

          echo ""
          echo "=== 删除后 ==="
          LEFT=$(gh api "repos/$REPO/actions/artifacts?per_page=100" --jq '.total_count')
          echo "剩余 $LEFT 个"
