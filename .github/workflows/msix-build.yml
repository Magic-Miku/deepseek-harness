name: Build MSIX (blue fish)

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version: auto（推荐）或官方格式的完整版本'
        type: string
        default: 'auto'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      # 官方脚本用 flag:'wx' 写 .env.windows——文件已存在会报错，先删掉
      - name: Remove stale .env.windows
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path "apps/desktop/.env.windows") {
            Remove-Item "apps/desktop/.env.windows" -Force
            Write-Host "removed stale .env.windows"
          }

      # 与官方 windows-package.yml 一致的调用方式
      - name: Prepare package settings
        id: settings
        continue-on-error: true
        env:
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version }}
          PACKAGE_DEPLOYMENT: test
          PACKAGE_POLICY_ORIGIN: https://example.invalid
          PACKAGE_LOGIN_ORIGINS: https://example.invalid
        run: |
          node apps/desktop/scripts/prepare-windows-ci.mjs *>&1 | Tee-Object -FilePath b0-prepare.log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath b0-prepare.log

      - name: Show generated version
        if: always()
        shell: pwsh
        run: |
          "version = ${{ steps.settings.outputs.version }}" | Out-File b0-version.log -Append
          Get-Content b0-version.log

      - name: Install dependencies
        id: install
        if: steps.settings.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile *>&1 | Tee-Object -FilePath b1-install.log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath b1-install.log
          exit $LASTEXITCODE

      # ① 官方脚本产出已打包的 app 目录（不生成 exe）
      - name: Package dir (official script, unsigned)
        id: dir
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          Push-Location apps/desktop
          pnpm exec tsx scripts/package-target.ts win-x64 --unsigned --dir --build-version "$env:PACKAGE_VERSION" *>&1 |
            Tee-Object -FilePath "..\..\b2-dir.log"
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath "..\..\b2-dir.log"
          Pop-Location

      # 定位包含主 exe 的目录
      - name: Locate packaged dir
        id: locate
        if: steps.dir.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "b3-locate.log"
          $root = "apps/desktop/.desktop-build"
          $cands = Get-ChildItem -Path $root -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "DeepSeek Harness.exe") }
          $cands | ForEach-Object { $_.FullName } | Out-File $log -Append
          $dir = $cands | Select-Object -First 1
          if (-not $dir) {
            $dir = Get-ChildItem -Path $root -Directory -Recurse -Filter "win-unpacked" -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if (-not $dir) {
            "NOT FOUND" | Out-File $log -Append
          } else {
            "apdir=$($dir.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
            Write-Host "APP DIR = $($dir.FullName)"
          }
          Get-Content $log

      # ② 用我们独立的配置打成 appx
      - name: Build appx via prepackaged
        id: appx
        if: steps.locate.outcome == 'success'
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm exec electron-builder --win appx `
            --prepackaged "${{ steps.locate.outputs.apdir }}" `
            --config electron-builder-appx.yml *>&1 | Tee-Object -FilePath b4-appx.log
          "EXIT=$LASTEXITCODE" | Tee-Object -Append -FilePath b4-appx.log
          exit $LASTEXITCODE

      - name: Report artifacts
        if: always()
        shell: pwsh
        run: |
          $log = "b5-artifacts.log"
          "=== dist-msix ===" | Out-File $log
          (Get-ChildItem "dist-msix" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize | Out-String) | Out-File $log -Append
          "" | Out-File $log -Append
          "=== 全仓搜索 appx/msix ===" | Out-File $log -Append
          (Get-ChildItem . -Recurse -Include *.appx,*.msix -ErrorAction SilentlyContinue |
            Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize | Out-String) | Out-File $log -Append
          Get-Content $log

      - name: Upload appx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-msix
          path: dist-msix/*.appx
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-build-logs
          path: b*.log
          if-no-files-found: warn
          retention-days: 14

      # ★ 新增：把日志推到 probe-logs 分支，便于读取具体报错
      - name: Commit logs to probe-logs
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-logs 2>/dev/null || git checkout probe-logs
          git add -f b*.log 2>/dev/null || true
          git commit -m "msix build logs run ${{ github.run_id }}" || echo "nothing"
          git push -f origin probe-logs || echo "push failed"
